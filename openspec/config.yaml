schema: label-suite-sdd

# 小型 change（文件、工具）仍可用 `--schema spec-driven` 走四份產物的舊流程。
# schema.yaml 只寫通用流程，本專案的規則都放在這份檔案；schema 與 scaffold 刻意不同之處在下面各段的註解寫明。
# 與 scaffold 刻意不同：只有 clarification 一個人工停點，規劃結束與 apply 結束都不停下等確認。

context: |
  規格分兩層：
  - docs/specs/（00-prd.mdx、glossary.mdx、NN-<module>/NN-<page>.mdx）描述產品做什麼、
    為什麼這樣做，只寫業務面。由維護者擁有；不得透過 OpenSpec change 更動其中的需求。
  - openspec/specs/ 是實作與測試依循的可測契約，只能透過 change 的 spec delta 修改。
    技術細節（API、資料模型、權限實作，以及測試集答案不外露的後端做法）寫在這一層。
  delta 中的每條 requirement 都須追溯到 docs/specs/ 的規格（註明規格編號 NN-NN 與
  Scenario 名稱，例：「來源：01-02 停用使用者」）。技術 change 沒有 docs/specs/ 的
  規格可追溯時（見 spec-migration 的 D4），改為追溯到 ADR 與規則文件的條號，
  例：「來源：ADR-003 D5、api-agent-rules A7」。delta 與 docs/specs/ 不一致時以
  docs/specs/ 為準：停下來，把衝突列為待維護者回答的問題，不得自行選邊。

  需求依據順序採分項優先：角色、權限上限、範圍與模組劃分以 docs/specs/00-prd.mdx 為準；
  其餘業務規則以維護者指定的需求文件與 docs/specs/ 的規格書為準。這兩類之外，
  docs/ 其他需求文件 ＞ openspec/。openspec 只引用規格的編號與章節，不另抄一份；
  需求要改先用 spec-writing 改 docs/specs/。引用的規格標為「草稿」或「待釐清」仍有未決項時，
  那一題記進 system-analysis 的待決問題，由 clarification 在那個停點一次問完。

  規劃階段的派工順序（整個 propose 由主 agent 依 schema 順序派工，除 clarification.md
  以外主 agent 不自己寫規劃產出）：
    sa 寫 system-analysis → sd 寫 system-design ∥ ui-ux 寫 ui-design → sd 寫 api-contract
    → planner 寫 proposal → 主 agent 以 clarify skill 的關卡模式寫 clarification
    → planner 寫 specs 與 design → planner 寫 tasks → design-reviewer 審閱、planner 回修。

  **只有一個人工停點**：clarification 的 Q（需要維護者決定的項目）逐題問答。P（明確
  問題）直接派原撰寫角色回修，不問維護者。
  其餘環節（明確問題的回修、規劃審閱、程式審查、驗收、歸檔、階段之間的提交、合併）
  全部自動，不詢問。驗收不再停下來等維護者：acceptance.md
  的人工驗收步驟照樣要寫，但它是事後抽查與出事時的紀錄，不是等人簽收的交付物。
  **故障類中斷不算關卡，照停**：task 描述有歧義、實作中發現規格有問題、工作超出 tasks.md
  的範圍、指令出錯——這些代表規劃錯了，不得硬推。

  AGENTS.md 是唯一的規則來源；以下只指出 OpenSpec 工作最常用到的段落，動手前先讀該段落。
  - Issue first：沒有列出工作項目的 open issue 就不開始 change
    （AGENTS.md "Hard Rules" 與 "Development Workflow"）。
  - 分支與 commit：不得直接 commit 到 main；commit message 依 AGENTS.md "Commits"，
    完整規則見 docs/development/workflow/commit-and-release.md。
  - 語言：artifact 以繁體中文撰寫；OpenSpec 結構標題與 SHALL／MUST 關鍵字維持英文
    （AGENTS.md "Language Rules"）。
  - 任務設定驅動（Hard Rule 5）與測試集答案不外露（Hard Rule 6）是 clarification
    第 9、10 個面向，在規劃階段就要有結論。
  change 名稱：kebab-case、字母開頭。
  CLI 以 `pnpm exec openspec` 執行（@fission-ai/openspec 是本專案的 devDependency）。

# 與 scaffold 刻意不同：本專案沒有「可延後／暫定值」制度，system-analysis、system-design、clarification 都不處理暫定值。
rules:
  # 與 scaffold 刻意不同：system-analysis 遇到待決問題不停（scaffold 在這裡停下問），統一留到 clarification 的停點。
  system-analysis:
    - 只寫業務，不出現框架、資料表、端點名稱
    - 業務流程以規格書的「業務流程」章節為準，只引用規格編號與流程名稱，不重畫
    - 每個待決問題都要寫出「影響」；**記下來並繼續，不要停下來問維護者，也不要自行假設**——所有需要維護者決定的事由 clarification 在那個停點一次問完
  system-design:
    - 分層是 Router → Service → Repository／Model；Router 不直接碰 Repository，資料層不處理 HTTP
    - 分層與回應包裝已定案：**模組內分層** `app/modules/<module>/`、成功回應**包一層 envelope**；照這兩項寫，不再列成待決問題，其他真正還沒定的細節才寫成提案，由 clarification 在那個停點拍板
    - Sequence Diagram 的標題要與 specs 的 Scenario 名稱相同，畫到 Router 回傳回應為止
    - schema 只由 Alembic 管理，SQLite（Lite）與 PostgreSQL 都要能升級；有 migration 時寫明 Alembic 的 down 能不能還原，以及 SQLite 與 PostgreSQL 的差異
    - 資料模型有異動時，先改 docs/diagrams/architecture/data-table-dictionary.mdx、再同步 database-schema.er.json、跑 `pnpm check:er`；「資料模型異動」節寫出這兩個路徑與異動摘要，不重抄整張表
    - classDiagram 的 Model 只畫屬性；表間關聯與多重性以 ER 為準
    - 後端模組的分層、Class Diagram 或主要 Sequence Diagram 有異動時，先改 docs/diagrams/architecture/backend-modules.mdx（動到 app/core/ 的基礎建設時改它的「後端基礎建設」節）；「常駐文件異動」節寫出這個路徑與異動摘要，不重抄常駐文件的內容
    - 權限檢查與欄位遮蔽都在後端完成；權限不得超出 PRD §權限矩陣，需要超出時列進待決問題
  # 與 scaffold 刻意不同：畫面以 design/prototype/pages/ 為準，沒有「Prototype 與 UI Kit 對照」。
  ui-design:
    - 每塊資料都要對應到 api-contract 的 operationId
    - 路由、頁面元件、對應的規格編號或 Logic Flow 節點有異動時，先改 docs/diagrams/architecture/frontend-routes.mdx（動到前端骨架時改它的「前端骨架」節）；「常駐文件異動」節寫出這個路徑與異動摘要，不重抄常駐文件的內容
    - loading／error／empty／無權限四種狀態都要寫；有遮蔽欄位時寫出呈現方式
    - 畫面長相以 design/prototype/pages/ 為準；token 只用 design/prototype/assets/tokens.css 與 label-suite-design skill 的語意名稱，不寫色碼，不自行定義色值或間距
    - 框架依 ADR-005 與 docs/development/architecture.mdx §前端（React 19 加 Vite 加 TypeScript strict，路由 React Router v6、伺服器狀態 TanStack Query，元件庫 shadcn/ui 放 components/ui/，目錄分層 pages/ 加 features/）；**不用 Storybook，改用元件展示頁**。元件以語意描述為主（例如「主要按鈕」「資料表」），需要時可指名 shadcn/ui 的元件，不貼實作程式碼
    - 沒有 UI 變更就只寫一行「本次無 UI 變更」
  api-contract:
    - operationId 全專案唯一，由 FastAPI 的 generate_unique_id_function **固定成「動詞加資源」**（例 listUsers、getUser），不手寫也不逐個覆寫；api-contract 寫的 operationId 必須與這個策略算出來的一致
    - 每個端點都要列出角色、錯誤碼與遮蔽欄位（沒有就寫「無」）
    - 錯誤碼或端點授權有異動時，先改 docs/diagrams/architecture/error-codes.mdx（新的錯誤碼、會回既有錯誤碼的新端點）與 endpoint-authorization.mdx（新端點、角色、PRD 權限矩陣的格、遮蔽的欄位（含答案））；「常駐文件異動」節寫出這兩個路徑與異動摘要，不重抄常駐文件的內容
    - 看不到的資源回 404，不得用 403 洩漏它存在；錯誤訊息不得回傳內部識別碼或堆疊
    - 成功回應**包一層 envelope**；**204 無 body、檔案與串流是明文例外**，端點屬於例外時要寫出理由
    - 路徑前綴一律 `/api/v1`
    - envelope 與 `/api/v1` 兩項都已定案，照這樣寫，不再列成待決問題
  proposal:
    - 列出引用的規格編號與章節（例：規格 02-03 §卡控機制）、其他需求文件章節與待決問題編號
    - 先讀 system-analysis、system-design、ui-design、api-contract 四份，不得與之矛盾
  # 與 scaffold 刻意不同：十個面向（scaffold 是八個），多出的第 9、10 面向對應 Hard Rule 5、6。
  # 與 scaffold 刻意不同：改變需求的決議只走 spec-writing 回寫規格書，不分流到 prd-writing。
  clarification:
    - 依 clarify skill 的關卡模式，**十個面向**都要有結論；specs、design、tasks 相關的檢查項標「後續產物」
    - 第 9 面向「任務設定驅動」：這次的行為有沒有寫死某一種任務類型？新增任務類型要不要改核心程式？（Hard Rule 5）
    - 第 10 面向「測試集答案不外露」：標記員能到達的端點與畫面，payload 裡有沒有標準答案或測試集標記？（Hard Rule 6）
    - 每個決議寫出理由、日期與回修位置；改變需求的決議先用 spec-writing 回寫 docs/specs/ 的規格書
    - 寫進規格書「已確認決議」的依據只有 docs/development/workflow/spec-migration.mdx §「已確認決議」的五種依據
    - 不新增 proposal 沒有的功能，只釐清既有範圍
  specs:
    - 只寫 What，不寫 How；技術細節放 design 或 tasks
    - 每個 Requirement 至少一個 Scenario，且可以直接寫成測試
    - Scenario 沿用規格書「驗收標準」的 Scenario 名稱；規格書的卡控機制與邊界情況都要有對應的 Scenario
    - 涉及欄位權限時，Scenario 要寫出被遮蔽時 payload 的樣子（哪個欄位不在、或換成什麼值），不要只寫「會被遮蔽」
    - 涉及測試集答案時要有負向 Scenario：標記員能到達的地方取不到答案
  design:
    - 決策要對應到 system-design 或 api-contract 的段落；那兩份寫過的不在這裡重寫
  # schema 裡 tasks 的 requires 順序寫成 api-contract、specs、design（scaffold 是 specs、design、api-contract），刻意保留。
  tasks:
    - 依 clarification 的決議撰寫
    - task 群組以「可獨立提交且能 build 的單位」劃分，依相依順序排列
    # 角色清單依 AGENTS.md §SDD Workflow 的 Roles 表：apply 實作只有這四個角色，審查、驗收、歸檔是另外的階段，不標在 tasks.md。
    - 每個 task 結尾標一個負責角色：[@backend-developer]、[@frontend-developer]、[@dba]、[@technical-writer]
    - 可平行的 task 放在同一個群組並在群組標題註明「（可平行）」
    - 測試與實作放在同一個 task（TDD，見 docs/development/architecture.mdx §測試分層），不另拆測試 task
    - 後端有改動的群組，最後一個 task 是「重新產生 openapi.json 與前端型別並確認與 api-contract 一致」
    - 有 schema 變更的 [@dba] task 要含「依實作校正資料表字典與 ER、為建立的表標記已落地與 Alembic revision、`pnpm check:er` 通過」
    - Python 用 uv、JavaScript 用 pnpm；不得出現 npm install 或 pip install
    - tasks 定稿後先提交規劃產出物，再交由 design-reviewer 審閱；修訂由 planner 另開 commit

operations:
  # 與 scaffold 刻意不同：驗收在 apply 的最後做、不停；後端測試在 SQLite 與 PostgreSQL 各跑一次（雙資料庫檢查指令）。
  apply:
    guidance:
      - 每個 task 群組由主 agent 依標記派給對應角色，主 agent 不自己改程式
      - 每完成一個 task 群組就提交一次，不要累積到最後；打勾代表實作與測試都完成
      - 提交前該群組動到的部分要通過本專案現有的檢查：`pnpm check:specs`、`pnpm test:scripts`（動到 scripts/ 時）、`pnpm exec notecraftapp build docs --rebuild`（動到 docs/ 時）；不得以忽略規則略過
      - "動到 frontend/ 時，lint：`pnpm --filter frontend lint`"
      - "動到 frontend/ 時，型別檢查：`pnpm --filter frontend typecheck`"
      - "動到 frontend/ 時，測試：`pnpm --filter frontend test`；要附覆蓋率報告時改用 `pnpm --filter frontend test:coverage`"
      - "動到 frontend/ 時，建置：`pnpm --filter frontend build`"
      - '動到 frontend/ 時，契約漂移：`pnpm --filter frontend api:generate && git diff --exit-code -- frontend/src/api/generated && test -z "$(git status --porcelain -- frontend/src/api/generated)"`；在 repo 根目錄執行，`git status` 那段抓第一次產生還沒提交的檔案'
      - "動到 backend/ 時，後端測試（SQLite）：`cd backend && uv run pytest`；標 `postgres` 的測試在這次會被跳過，回報結果時要附上 pytest 摘要裡的 skipped 數量，不得只寫「通過」"
      - "動到 backend/ 時，後端測試（PostgreSQL）：`cd backend && TEST_DATABASE_URL=postgresql+asyncpg://... uv run pytest`；`TEST_DATABASE_URL` 由本機 `docker run postgres:16` 提供，這次應為 0 skipped"
      - "動到 backend/ 時，lint 與格式：`cd backend && uv run ruff check . && uv run ruff format --check .`"
      - "動到 backend/ 時，型別檢查：`cd backend && uv run mypy --strict app`"
      - '動到 backend/ 時，契約漂移：`cd backend && uv run python -m app.scripts.export_openapi && git diff --exit-code -- openapi.json ../docs/diagrams/architecture/api.openapi.json && test -z "$(git status --porcelain -- openapi.json ../docs/diagrams/architecture/api.openapi.json)"`；路徑相對於 backend/，`git status` 那段抓第一次匯出還沒提交的檔案，兩個檔（後端契約與文件站副本）一起比對'
      - 後端 API 有變動時，同一個群組內重新產生 openapi.json 與前端型別，並確認與 api-contract 一致
      - 全部 task 完成且工作區乾淨後，交由 code-reviewer 審查；修正由實作角色另開 commit
      - 審查通過後交由 acceptance-verifier 對照每個 Scenario 驗收，報告寫在 change 目錄的 acceptance.md；未通過不進入下一步
      - acceptance.md 要附**人工驗收步驟**：啟動指令、用哪個角色登入、點哪幾頁、每一步預期看到什麼。它留作紀錄，不是停下來等維護者簽收的交付物
      - 驗收通過後步驟結束時自動提交，**不停**；接著由 ops 執行 /opsx:archive，歸檔改動進同一張 PR，再走合併條件（CI 每個 job 都 completed 且 success、審查無阻斷意見、PR 可合併）
  # 與 scaffold 刻意不同：archive 在合併之前執行，與程式同一張 PR；這裡不重做驗收。
  archive:
    guidance:
      - 歸檔前確認工作區乾淨；驗收已經在 apply 的最後做過，這裡不重做驗收判定
      - 同步主規格與搬移到 archive 由 ops 執行；新 capability 的 Purpose 不留 TBD
      - "**在合併之前執行**：歸檔改動與程式進同一張 PR，main 上不會出現已合併但未歸檔的 change"
      - 步驟結束時自動提交；PR 在 apply 期間就已經開好，這裡不另開
