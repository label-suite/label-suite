# Alembic configuration for the Label Suite backend.
#
# There is no sqlalchemy.url here on purpose: alembic/env.py builds the URL from
# app.core.config.DatabaseSettings (DATABASE_URL or SQLITE_PATH), the same code the
# API uses (backend-agent-rules B10). Run every command from backend/:
#
#   uv run alembic revision --autogenerate -m "<what changes>"
#   uv run alembic upgrade head
#   uv run alembic downgrade -1

[alembic]
script_location = %(here)s/alembic

# Migration files sort by creation time: YYYYMMDD_HHMM_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Make the app package importable from env.py.
prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
