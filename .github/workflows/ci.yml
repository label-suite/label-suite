name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  commit-messages:
    name: commit-messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checker regression tests
        run: scripts/tests/check-commit-msg-tests.sh

      - name: Check every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if ! scripts/check-commit-msg.sh "$RUNNER_TEMP/msg.txt"; then
              echo "::error::commit $sha has an invalid message (details above)"
              failed=1
            fi
          done
          exit "$failed"

  docs-site:
    name: docs-site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # notecraftapp needs Node 22 or newer.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # notecraftapp downloads its own app bundle and installs that bundle's
      # dependencies under ~/.notecraft the first time it runs. Issue #148 is the
      # record of exactly that install failing on a registry hiccup, so the
      # bundle is cached between runs: without the cache, every pull request
      # would depend on the registry being healthy at that moment.
      - name: Cache the notecraft app bundle
        uses: actions/cache@v4
        with:
          path: ~/.notecraft
          key: notecraft-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            notecraft-${{ runner.os }}-

      # The build is the only gate that catches an MDX compile error; check-specs
      # has passed three times on a page the build then refused.
      #
      # No retry here on purpose. This step used to run the build twice
      # (`... || ...`) because of issue #172, where the first --rebuild after an
      # edit fails intermittently. That bug's root cause turned out to be a
      # local `notecraftapp serve docs` watcher racing a manual build over the
      # same `.astro/` directory, with no lock between the two processes. CI
      # never runs `serve`, so it cannot hit it: the docs-site job's first
      # attempt has not failed once in the six runs checked on 2026-11-12, nor
      # in the clean-checkout run recorded on the issue. Retrying would only
      # mask a build that genuinely fails twice -- the second row of the
      # warning table in the issue itself.
      - name: Build the docs site
        run: pnpm exec notecraftapp build docs --rebuild

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pre-commit hook formats staged files, but it only runs where
      # scripts/setup.sh was run and can be skipped with --no-verify; this job
      # is the gate. Paths in .prettierignore are not checked.
      - name: Check formatting with Prettier
        run: pnpm format:check

  specs:
    name: specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          # No dependencies are installed, so skip the pnpm cache that
          # packageManager in package.json would otherwise turn on.
          package-manager-cache: false

      - name: Checker regression tests
        run: node --test scripts/tests/check-specs.test.mjs

      - name: Flow checker regression tests
        run: node --test scripts/tests/check-flows.test.mjs

      - name: Prototype server tests
        run: node --test scripts/tests/serve-prototype.test.mjs

      - name: Check PRD and module specs
        run: node scripts/check-specs.mjs docs

      - name: Check the business flow diagrams
        run: node scripts/check-flows.mjs

      - name: ER data checker regression tests
        run: node --test scripts/tests/check-er-data.test.mjs

      - name: Check the candidate table dictionary against the ER diagram
        run: node scripts/check-er-data.mjs

      - name: Citation checker regression tests
        run: node --test scripts/tests/check-citations.test.mjs

      # Fails on errors (a cited file that is missing or ambiguous, a line
      # outside the file, a bare :N with no file) and, with --strict, on WARN:
      # a cited line that names nothing its sentence names. WARN reached zero
      # in #459, so a line number that drifts onto an unrelated line now fails
      # the job; fix the citation, or add an ALLOW entry with its reason.
      # It also fails on a wrong spec reference in a module's §Logic Flow
      # (`03-01 §節名 第 N 條`, 主流程第 N 步, EN/AN, QN, a quote that is not
      # verbatim); fix the reference, or add a SPEC_ALLOW entry with its reason.
      - name: Check the file:line citations and the Logic Flow spec references
        run: node scripts/check-citations.mjs --strict

  # The two backend jobs run on every pull request, with no path filter and no
  # job-level condition, so a docs-only pull request still runs them. Each job
  # writes its own coverage data file; the coverage job (a later task) combines
  # them. upload-artifact v4.4.0 and later skip hidden files by default, and
  # .coverage.* is hidden, so the uploads set include-hidden-files and fail when
  # the file is missing instead of silently uploading nothing.
  backend-sqlite:
    name: backend-sqlite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # check-junit-skips.mjs has no dependencies, so Node alone is enough; skip
      # the pnpm cache that packageManager in package.json would turn on.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy --strict app

      - name: Check the import contracts
        run: uv run lint-imports

      # TEST_DATABASE_URL is deliberately not set: this is the SQLite round, and
      # tests marked postgres skip here.
      - name: Test on SQLite
        env:
          COVERAGE_FILE: .coverage.sqlite
        run: uv run pytest --cov=app --cov-branch --junitxml=test-results/junit-sqlite.xml

      # Reports how many tests skipped; it never fails on a skip, because the
      # postgres-marked tests are meant to skip in this round.
      - name: Report the skipped count
        run: node ../scripts/check-junit-skips.mjs --summary test-results/junit-sqlite.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-sqlite
          path: backend/.coverage.sqlite
          include-hidden-files: true
          if-no-files-found: error

  backend-postgres:
    name: backend-postgres
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # The server is reachable only from this job's runner. The password is
          # derived from the run, not written here: a test builds on the URL's
          # password, so it cannot be empty, and the service starts before any
          # step could generate one.
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Test on PostgreSQL
        env:
          COVERAGE_FILE: .coverage.postgres
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
        run: uv run pytest --cov=app --cov-branch --junitxml=test-results/junit-postgres.xml

      # Fails when any test skipped, so a postgres-marked test cannot silently
      # stop running in this round.
      - name: Fail on skipped tests
        run: node ../scripts/check-junit-skips.mjs test-results/junit-postgres.xml

      - name: Upload the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend-postgres
          path: backend/.coverage.postgres
          include-hidden-files: true
          if-no-files-found: error

  # Checks run in the same order as the local `check` command, and lint comes
  # first so a layering violation or a warning fails the job before the slower
  # steps. Every step stops the job on failure; none runs under always().
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Check types
        run: pnpm --filter frontend typecheck

      - name: Test with coverage
        run: pnpm --filter frontend test:coverage

      - name: Build
        run: pnpm --filter frontend build

      # json-summary is the input of the coverage job (a later task).
      - name: Upload the coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: error

  # Runs on every pull request against the development servers and a SQLite
  # file; CI=true (set by Actions) makes Playwright start fresh servers and
  # retry once. The report is uploaded only when a journey fails.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the backend dependencies
        run: cd backend && uv sync --locked

      - name: Check the static e2e constraints
        run: pnpm --filter e2e test:static

      - name: Install Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run the e2e journeys
        run: pnpm --filter e2e test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: error

  # Catches an API change that was not exported, and an exported change that was
  # not regenerated into the frontend client (or a hand-edited generated file).
  # Nothing is started: the export needs no environment variable and no database.
  # `git diff` catches a changed file and `git status --porcelain` catches a new
  # untracked one; each failure lists the file names. The fix is `pnpm run
  # api:sync` locally, then commit.
  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the backend dependencies
        run: cd backend && uv sync --locked

      - name: Export the OpenAPI document
        run: cd backend && uv run python -m app.scripts.export_openapi

      - name: Check backend/openapi.json and its docs copy are up to date
        run: |
          drift=0
          git diff --exit-code --name-only -- backend/openapi.json docs/diagrams/architecture/api.openapi.json || drift=1
          untracked=$(git status --porcelain -- backend/openapi.json docs/diagrams/architecture/api.openapi.json)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then
            echo "::error::backend/openapi.json or docs/diagrams/architecture/api.openapi.json is out of date (files listed above); run 'pnpm run api:sync' and commit the result"
            exit 1
          fi

      - name: Regenerate the frontend API client
        run: pnpm --filter frontend api:generate

      - name: Check frontend/src/api/generated is up to date
        run: |
          drift=0
          git diff --exit-code --name-only -- frontend/src/api/generated || drift=1
          untracked=$(git status --porcelain -- frontend/src/api/generated)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then
            echo "::error::frontend/src/api/generated is out of date; run 'pnpm run api:sync' and commit the result"
            exit 1
          fi

  # The official image at a pinned version, so a new Semgrep release cannot
  # change what a pull request is judged by. The scan names the one rule file:
  # .semgrep/tests/label-suite.yml is a symlink that `semgrep --test` needs, and
  # `--config .semgrep/` would load every rule twice.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@v5

      - name: Test the rules against their samples
        run: semgrep --test .semgrep/

      - name: Scan for the project rules
        run: semgrep scan --error --config .semgrep/label-suite.yml backend/ frontend/ e2e/

  # pip-audit 2.10.1 has no severity flag, so any known vulnerability in the
  # backend environment fails the job. pnpm audit fails on high or above in the
  # production dependencies only.
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # No dependencies are installed, so skip the pnpm cache that
          # packageManager in package.json would otherwise turn on.
          package-manager-cache: false

      - uses: astral-sh/setup-uv@v6

      - name: Install the backend dependencies
        run: cd backend && uv sync --locked

      - name: Audit the backend dependencies
        run: cd backend && uv run pip-audit

      - name: Audit the frontend production dependencies
        run: pnpm audit --prod --audit-level high

  # Decides whether the compose job has to run. It needs the full history for
  # the merge base; a base it cannot diff answers "run compose" rather than
  # failing (scripts/ci-changed-paths.mjs).
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      compose: ${{ steps.paths.outputs.compose }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Decide whether compose runs
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changed-paths.mjs --base "$BASE" --head "$HEAD"

  # Builds and starts both tiers for real. Only pull requests that touch the
  # orchestration, an image or the code it runs get here (see `changes`), so it
  # is not a required check. The production password is generated inside the job
  # and masked: the example file leaves it empty on purpose, and `${VAR:?}` rejects
  # an empty value as well as an unset one.
  compose:
    name: compose
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # `up --wait` with a one-off migrate service needs Compose v2.20.0 or newer
      # (older versions count the exited migrate container as a failure).
      - name: Check the Compose version
        run: |
          docker compose version
          version=$(docker compose version --short)
          version=${version#v}
          minimum=2.20.0
          lowest=$(printf '%s\n%s\n' "$version" "$minimum" | sort -V | head -n 1)
          if [ "$lowest" != "$minimum" ]; then
            echo "::error::Docker Compose $version is older than the required $minimum"
            exit 1
          fi

      - name: Copy the example environment file
        run: cp .env.example .env

      - name: Generate a one-off database password
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "GENERATED_POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Resolve the Lite tier
        run: docker compose config --quiet

      - name: Resolve the production tier
        run: POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml config --quiet

      # Shell variables beat .env, and an empty one trips `${VAR:?}`. If either
      # command succeeds, a required setting is no longer required.
      - name: Check that a missing allowed origin is rejected
        run: |
          if out=$(CORS_ALLOWED_ORIGINS= docker compose config --quiet 2>&1); then
            echo "::error::an empty CORS_ALLOWED_ORIGINS was accepted"
            exit 1
          fi
          echo "$out"
          grep -q CORS_ALLOWED_ORIGINS <<< "$out" || {
            echo "::error::the rejection did not name CORS_ALLOWED_ORIGINS"
            exit 1
          }

      - name: Check that a missing database password is rejected
        run: |
          if out=$(POSTGRES_PASSWORD= docker compose -f docker-compose.prod.yml config --quiet 2>&1); then
            echo "::error::an empty POSTGRES_PASSWORD was accepted"
            exit 1
          fi
          echo "$out"
          grep -q POSTGRES_PASSWORD <<< "$out" || {
            echo "::error::the rejection did not name POSTGRES_PASSWORD"
            exit 1
          }

      # Reads the resolved configuration; nothing is started. In both tiers only
      # the frontend publishes a port and no Redis or worker service exists, the
      # frontend waits for a healthy backend, and the backend health check polls
      # /api/v1/health every 30 seconds.
      - name: Assert the structure of both orchestration files
        run: |
          docker compose config --format json > "$RUNNER_TEMP/lite.json"
          POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml config --format json > "$RUNNER_TEMP/prod.json"
          for file in lite prod; do
            echo "checking the $file tier"
            jq -e '[.services | to_entries[] | select((.value.ports // []) | length > 0) | .key] == ["frontend"]' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: only frontend may publish ports"; exit 1; }
            jq -e '[.services | keys[] | select(test("redis|worker"))] | length == 0' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: no redis or worker service is expected"; exit 1; }
            jq -e '.services.frontend.depends_on.backend.condition == "service_healthy"' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: frontend must wait for a healthy backend"; exit 1; }
            jq -e '.services.backend.healthcheck.interval == "30s" and (.services.backend.healthcheck.test | join(" ") | contains("/api/v1/health"))' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: backend health check must poll /api/v1/health every 30s"; exit 1; }
          done

      - name: Start the Lite tier
        run: docker compose up --build --wait --wait-timeout 300

      # The backend publishes no port, so this request also proves the reverse proxy.
      - name: Check the Lite health through nginx
        run: |
          body=$(curl -fsS http://localhost:8080/api/v1/health)
          echo "$body"
          jq -e '.data.status == "ok" and .data.database == "ok"' <<< "$body"

      - name: Stop the Lite tier
        run: docker compose down -v

      - name: Start the production tier
        run: POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml up --build --wait --wait-timeout 300

      - name: Check the production health through nginx
        run: |
          body=$(curl -fsS http://localhost:8080/api/v1/health)
          echo "$body"
          jq -e '.data.status == "ok" and .data.database == "ok"' <<< "$body"

      - name: Stop the production tier
        run: POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml down -v

      - name: Show the container logs
        if: failure()
        run: |
          docker compose logs --no-color || true
          POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml logs --no-color || true

  # Combines the two backend rounds (a path only PostgreSQL reaches would count
  # as uncovered in one round) and compares the result with the baseline file.
  # It also compares the PR's baseline with the base branch's, so a PR cannot
  # lower coverage by editing the baseline; a maintainer's coverage-baseline-lower
  # label is the one exception. Adding or removing the label reruns the workflow
  # (on.pull_request.types). The job only reads the repository: the suggested
  # baseline is uploaded, never committed.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [backend-sqlite, backend-postgres, frontend]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: astral-sh/setup-uv@v6

      - name: Install the locked backend dependencies
        run: cd backend && uv sync --locked

      # The base branch has no baseline file only in the pull request that creates
      # it; the script then prints a notice and skips the "not lowered" check.
      - name: Read the base branch baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:coverage-baseline.json" > "$RUNNER_TEMP/base-coverage-baseline.json"; then
            echo "Read coverage-baseline.json from origin/${BASE_REF}"
          else
            rm -f "$RUNNER_TEMP/base-coverage-baseline.json"
            echo "::notice::origin/${BASE_REF} has no coverage-baseline.json"
          fi

      - name: Download the SQLite coverage data
        uses: actions/download-artifact@v5
        with:
          name: coverage-backend-sqlite
          path: backend

      - name: Download the PostgreSQL coverage data
        uses: actions/download-artifact@v5
        with:
          name: coverage-backend-postgres
          path: backend

      - name: Download the frontend coverage summary
        uses: actions/download-artifact@v5
        with:
          name: coverage-frontend
          path: frontend/coverage

      # Both data files record paths under backend/ of the runner's checkout, which
      # is where this job checks out too, so the sources resolve.
      - name: Combine the backend coverage data
        working-directory: backend
        run: uv run coverage combine .coverage.sqlite .coverage.postgres

      - name: Export the backend coverage as JSON
        working-directory: backend
        run: uv run coverage json -o coverage.json

      - name: Compare with the coverage baseline
        env:
          ALLOW_LOWER: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-baseline-lower') }}
        run: |
          args=(
            --backend backend/coverage.json
            --frontend frontend/coverage/coverage-summary.json
            --baseline coverage-baseline.json
            --suggested-out coverage-baseline-suggested.json
          )
          if [ -f "$RUNNER_TEMP/base-coverage-baseline.json" ]; then
            args+=(--base-baseline "$RUNNER_TEMP/base-coverage-baseline.json")
          fi
          if [ "$ALLOW_LOWER" = "true" ]; then
            args+=(--allow-lower)
          fi
          node scripts/check-coverage.mjs "${args[@]}"

      # Uploaded after a failure too: a missing baseline fails the comparison but
      # still writes the suggested file, which is how the first baseline is made.
      - name: Upload the suggested baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline-suggested
          path: coverage-baseline-suggested.json
          if-no-files-found: ignore

  # No needs and no if: it starts with the other jobs, so a broken script or a
  # skipped CI check is reported even when a backend job fails (design D11).
  scripts-tests:
    name: scripts-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Script and workflow tests
        run: |
          node --test \
            scripts/tests/check-coverage.test.mjs \
            scripts/tests/check-junit-skips.test.mjs \
            scripts/tests/ci-changed-paths.test.mjs \
            scripts/tests/check.test.mjs \
            scripts/tests/dev.test.mjs \
            scripts/tests/ci-workflow.test.mjs
