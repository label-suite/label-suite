name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  commit-messages:
    name: commit-messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checker regression tests
        run: scripts/tests/check-commit-msg-tests.sh

      - name: Check every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: scripts/check-pr-commits.sh "$BASE" "$HEAD" "$PR_AUTHOR"

  hooks:
    # The hook checkers are shell, and shell is where a script passes on the
    # machine it was written on and fails on the other one. Both platforms run
    # the same suites against the same pinned constants, so a divergence is a
    # red job rather than something a reader has to notice. macOS is in the
    # matrix because this repository is public and its runner minutes are
    # free; the cross-platform requirement is issue #111's, not a nicety.
    # Windows runs the same suites under Git Bash (#830). It is not a required
    # check (maintainer decision, 2026-11-28): it reports, it does not gate.
    name: hooks (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.hooks == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows steps default to PowerShell; every step here is bash.
    defaults:
      run:
        shell: bash
    # The checkers set no limit of their own -- they are forbidden to shell out
    # to `timeout`, which this machine does not have -- so the ceiling for the
    # CI side is expressed here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check-changed.sh --range` walks between the two pull-request
          # commits, so the shallow default is not enough.
          fetch-depth: 0

      # H1 reports the toolchain and `--ci` turns a missing one into a non-zero
      # exit, so this job has to carry the toolchain it is going to report on.
      # The first real run of this job failed on exactly that: no pnpm, so
      # `--ci` refused a checkout that was in fact healthy. uv is here for the
      # same reason -- `backend/` exists now, which makes it required rather
      # than NA, and it is what `check-changed.sh --range` runs the Python
      # route through. Both are also the runners the routes reach their tools
      # through, and the two steps below provision what those runners run.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          # The pnpm cache is left off deliberately: this job installs the
          # frontend toolchain from the lockfile below, and a warm cache
          # would hide a lockfile that no longer resolves.
          package-manager-cache: false

      # The Python route runs `uv run --no-sync`, because a hook must not
      # provision an environment behind the author's back. That makes
      # provisioning this job's business: without it the route fails on every
      # pull request that touches `backend/`, and a gate that cannot run the
      # check it routes to is not reporting on the code.
      - name: Provision the backend environment the Python route runs in
        run: uv sync --frozen
        working-directory: backend

      # Same reason on the TypeScript side: `tsc` and `eslint` live in
      # `frontend/node_modules/.bin`, and the route reaches them through
      # `pnpm exec`, which installs nothing.
      - name: Provision the frontend toolchain the TypeScript route runs in
        run: pnpm install --frozen-lockfile

      # The suites build their JSON payloads with `python3`, which a Windows
      # runner provides only as `python`. A shim keeps the suites unchanged;
      # on the other platforms the step does not run.
      - name: Provide python3 on Windows
        if: runner.os == 'Windows'
        run: |
          command -v python3 >/dev/null 2>&1 && python3 -c 'import json' 2>/dev/null && exit 0
          shim="$RUNNER_TEMP/python3-shim"
          mkdir -p "$shim"
          printf '#!/bin/sh\nexec python "$@"\n' > "$shim/python3"
          chmod +x "$shim/python3"
          echo "$shim" >> "$GITHUB_PATH"

      # A glob, not a list. A suite that is added and not wired up is the
      # failure this job exists to prevent, and a list is the place that gets
      # forgotten. check-commit-msg-tests.sh runs here as well as in
      # commit-messages; that job checks the pull request's own commits and
      # keeps its own regression step so it stands on its own.
      - name: Checker and hook regression tests
        run: |
          failed=0
          for suite in scripts/tests/*-tests.sh; do
            echo "::group::$suite"
            if bash "$suite"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$suite::$suite failed (details in the group above)"
              failed=1
            fi
          done
          exit "$failed"

      # Named rather than globbed: the other *.test.mjs files belong to the
      # specs job, and running them twice would say nothing. ci-wiring-tests.sh
      # is what keeps this line from being the one that gets forgotten.
      - name: Payload reader tests
        run: node --test scripts/tests/hook-payload.test.mjs

      # Separate from the suites: this one reads the checker layer itself, so
      # a failure here names a line of production shell rather than a test.
      - name: Forbidden constructs in the checker layer
        run: scripts/tests/forbidden-terms-lint.sh

      # The route table decides which checks a changed file gets, so a silent
      # change to it silently changes what this repository enforces.
      - name: The route set is unchanged
        run: |
          expected=$(cat <<'ROUTES'
          routes:
            backend/**/*.py -> ruff check, mypy --strict (backend/ 存在)
            frontend/**/*.ts,tsx -> tsc -b, eslint, node scripts/check-component-reuse.mjs (frontend/ 存在)
            其他位置的 *.py, *.ts, *.tsx -> NA (不在 backend/、frontend/ 專案內)
            docs/**/*.mdx, docs/**/*.md -> node scripts/check-specs.mjs docs (一律啟用)
          ROUTES
          )
          actual=$(scripts/check-changed.sh --list-routes)
          if ! diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"); then
            echo "::error::the enabled route set changed; update this step in the same commit"
            exit 1
          fi
          printf '%s\n' "$actual"

      - name: Route the files this pull request changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-changed.sh --range "$BASE..$HEAD"

      # Issue #111 task 5.3. macOS was measured by hand on 2026-11-17 (BSD
      # `head` leaves a partial 3-byte character at the 65536-byte boundary and
      # the output stops decoding); this is the Linux half of the same input,
      # and it is the only place in this process that runs on Linux. The
      # library must not depend on either behaviour: it truncates in node and
      # the assertion is that its output decodes on both platforms.
      # `head` runs in this shell and node only decodes what it is handed: a
      # node `execSync("head ...")` goes through cmd.exe on Windows, which has
      # no `head`, and `/tmp` means a different directory to node there.
      - name: Truncation does not depend on this platform's head
        run: |
          wide="$RUNNER_TEMP/wide.txt"
          node -e 'process.stdout.write("\u4e2d".repeat(23000))' > "$wide"
          printf 'platform: %s, head: ' "$(uname -s)"
          head -c 65536 "$wide" | tail -c 4 | od -An -tx1 | tr -d ' \n'
          printf '\n'
          head -c 65536 "$wide" | node -e '
            const b = require("node:fs").readFileSync(0);
            try {
              new TextDecoder("utf-8", { fatal: true }).decode(b);
              console.log("raw head -c output decodes on this platform");
            } catch {
              console.log("raw head -c output does NOT decode on this platform");
            }
          '
          bash scripts/tests/hook-common-tests.sh

      # Last on purpose. Until the registration configs land (issue #111 group
      # 6) this step necessarily reports the missing `.codex/hooks.json`, and
      # that is the known cost of putting CI before registration recorded in
      # the change's migration plan. Ordering it last keeps every step above it
      # reporting, instead of being skipped behind a red one.
      - name: Both hook registration configs agree with the checkers
        run: scripts/check-env.sh --ci

  docs-site:
    name: docs-site
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_site == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # notecraftapp needs Node 22 or newer.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # notecraftapp downloads its own app bundle and installs that bundle's
      # dependencies under ~/.notecraft the first time it runs. Issue #148 is the
      # record of exactly that install failing on a registry hiccup, so the
      # bundle is cached between runs: without the cache, every pull request
      # would depend on the registry being healthy at that moment.
      - name: Cache the notecraft app bundle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.notecraft
          key: notecraft-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            notecraft-${{ runner.os }}-

      # The build is the only gate that catches an MDX compile error; check-specs
      # has passed three times on a page the build then refused.
      #
      # No retry here on purpose. This step used to run the build twice
      # (`... || ...`) because of issue #172, where the first --rebuild after an
      # edit fails intermittently. That bug's root cause turned out to be a
      # local `notecraftapp serve docs` watcher racing a manual build over the
      # same `.astro/` directory, with no lock between the two processes. CI
      # never runs `serve`, so it cannot hit it: the docs-site job's first
      # attempt has not failed once in the six runs checked on 2026-11-12, nor
      # in the clean-checkout run recorded on the issue. Retrying would only
      # mask a build that genuinely fails twice -- the second row of the
      # warning table in the issue itself.
      - name: Build the docs site
        run: pnpm exec notecraftapp build docs --rebuild

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pre-commit hook formats staged files, but it only runs where
      # scripts/setup.sh was run and can be skipped with --no-verify; this job
      # is the gate. Paths in .prettierignore are not checked.
      - name: Check formatting with Prettier
        run: pnpm format:check

  specs:
    name: specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          # No dependencies are installed, so skip the pnpm cache that
          # packageManager in package.json would otherwise turn on.
          package-manager-cache: false

      - name: Checker regression tests
        run: node --test scripts/tests/check-specs.test.mjs

      - name: Flow checker regression tests
        run: node --test scripts/tests/check-flows.test.mjs

      - name: Prototype server tests
        run: node --test scripts/tests/serve-prototype.test.mjs

      - name: Check PRD and module specs
        run: node scripts/check-specs.mjs docs

      - name: Check the business flow diagrams
        run: node scripts/check-flows.mjs

      - name: ER data checker regression tests
        run: node --test scripts/tests/check-er-data.test.mjs

      - name: Check the candidate table dictionary against the ER diagram
        run: node scripts/check-er-data.mjs

      - name: Site map data generator regression tests
        run: node --test scripts/tests/gen-site-map-data.test.mjs

      # The PRD §Site Map tree reads .notecraft/components/site-map-data.ts,
      # generated from each spec's `## 規格` subsections. Fails when a `###`
      # was added or renamed without rerunning the generator.
      - name: Check the site map data against the specs
        run: node scripts/gen-site-map-data.mjs --check

      - name: Citation checker regression tests
        run: node --test scripts/tests/check-citations.test.mjs

      # Fails on errors (a cited file that is missing or ambiguous, a line
      # outside the file, a bare :N with no file) and, with --strict, on WARN:
      # a cited line that names nothing its sentence names. WARN reached zero
      # in #459, so a line number that drifts onto an unrelated line now fails
      # the job; fix the citation, or add an ALLOW entry with its reason.
      # It also fails on a wrong spec reference in a module's §Logic Flow
      # (`03-01 §節名 第 N 條`, 主流程第 N 步, EN/AN, QN, a quote that is not
      # verbatim); fix the reference, or add a SPEC_ALLOW entry with its reason.
      - name: Check the file:line citations and the Logic Flow spec references
        run: node scripts/check-citations.mjs --strict

      - name: Component reuse checker regression tests
        run: node --test scripts/tests/check-component-reuse.test.mjs

      # Fails when a component file under frontend/src/features/ or pages/ is
      # named like a shared design-system component without importing its
      # implementation in frontend/src/components/, when a shared component's
      # 「程式實作」 points into features/ or pages/, or when a spec's 「程式實作」
      # names a missing file. Existing violations are listed in the script, each
      # with the issue that moves it; a row whose file no longer violates fails.
      - name: Check that new screens reuse the design-system components
        run: node scripts/check-component-reuse.mjs

  # The two backend jobs, frontend, coverage and e2e share the `code` condition
  # from `changes` (frontend and e2e widen it with their own paths), so a
  # docs-only pull request skips them; GitHub reports a job skipped by its `if`
  # as passing. Each job writes its own coverage data file and the coverage job
  # combines them. upload-artifact v4.4.0 and later skip hidden files by default, and
  # .coverage.* is hidden, so the uploads set include-hidden-files and fail when
  # the file is missing instead of silently uploading nothing.
  backend-sqlite:
    name: backend-sqlite
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-junit-skips.mjs has no dependencies, so Node alone is enough; skip
      # the pnpm cache that packageManager in package.json would turn on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check types
        run: uv run mypy --strict app

      - name: Check the import contracts
        run: uv run lint-imports

      # TEST_DATABASE_URL is deliberately not set: this is the SQLite round, and
      # tests marked postgres skip here.
      - name: Test on SQLite
        env:
          COVERAGE_FILE: .coverage.sqlite
        run: uv run pytest --cov=app --cov-branch --junitxml=test-results/junit-sqlite.xml

      # Reports how many tests skipped; it never fails on a skip, because the
      # postgres-marked tests are meant to skip in this round.
      - name: Report the skipped count
        run: node ../scripts/check-junit-skips.mjs --summary test-results/junit-sqlite.xml >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend-sqlite
          path: backend/.coverage.sqlite
          include-hidden-files: true
          if-no-files-found: error

  backend-postgres:
    name: backend-postgres
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # The server is reachable only from this job's runner. The password is
          # derived from the run, not written here: a test builds on the URL's
          # password, so it cannot be empty, and the service starts before any
          # step could generate one.
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Test on PostgreSQL
        env:
          COVERAGE_FILE: .coverage.postgres
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/postgres
        run: uv run pytest --cov=app --cov-branch --junitxml=test-results/junit-postgres.xml

      # Fails when any test skipped, so a postgres-marked test cannot silently
      # stop running in this round.
      - name: Fail on skipped tests
        run: node ../scripts/check-junit-skips.mjs test-results/junit-postgres.xml

      - name: Upload the coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-backend-postgres
          path: backend/.coverage.postgres
          include-hidden-files: true
          if-no-files-found: error

  # Checks run in the same order as the local `check` command, and lint comes
  # first so a layering violation or a warning fails the job before the slower
  # steps. Every step stops the job on failure; none runs under always().
  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Check types
        run: pnpm --filter frontend typecheck

      - name: Test with coverage
        run: pnpm --filter frontend test:coverage

      - name: Build
        run: pnpm --filter frontend build

      # json-summary is the input of the coverage job (a later task).
      - name: Upload the coverage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage/coverage-summary.json
          if-no-files-found: error

  # Runs when the code group or e2e/ changed, against the development servers
  # and a SQLite file; CI=true (set by Actions) makes Playwright start fresh
  # servers and retry once. The report is uploaded only when a journey fails.
  e2e:
    name: e2e
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the backend dependencies
        run: cd backend && uv sync --locked

      - name: Check the static e2e constraints
        run: pnpm --filter e2e test:static

      - name: Install Chromium
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Run the e2e journeys
        run: pnpm --filter e2e test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: error

  # Catches an API change that was not exported, and an exported change that was
  # not regenerated into the frontend client (or a hand-edited generated file).
  # Nothing is started: the export needs no environment variable and no database.
  # `git diff` catches a changed file and `git status --porcelain` catches a new
  # untracked one; each failure lists the file names. The fix is `pnpm run
  # api:sync` locally, then commit.
  api-contract:
    name: api-contract
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api_contract == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the backend dependencies
        run: cd backend && uv sync --locked

      - name: Export the OpenAPI document
        run: cd backend && uv run python -m app.scripts.export_openapi

      - name: Check backend/openapi.json and its docs copy are up to date
        run: |
          drift=0
          git diff --exit-code --name-only -- backend/openapi.json docs/diagrams/architecture/api.openapi.json || drift=1
          untracked=$(git status --porcelain -- backend/openapi.json docs/diagrams/architecture/api.openapi.json)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then
            echo "::error::backend/openapi.json or docs/diagrams/architecture/api.openapi.json is out of date (files listed above); run 'pnpm run api:sync' and commit the result"
            exit 1
          fi

      - name: Regenerate the frontend API client
        run: pnpm --filter frontend api:generate

      - name: Check frontend/src/api/generated is up to date
        run: |
          drift=0
          git diff --exit-code --name-only -- frontend/src/api/generated || drift=1
          untracked=$(git status --porcelain -- frontend/src/api/generated)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then
            echo "::error::frontend/src/api/generated is out of date; run 'pnpm run api:sync' and commit the result"
            exit 1
          fi

  # The official image at a pinned version, so a new Semgrep release cannot
  # change what a pull request is judged by. The scan names the one rule file:
  # .semgrep/tests/label-suite.yml is a symlink that `semgrep --test` needs, and
  # `--config .semgrep/` would load every rule twice.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the rules against their samples
        run: semgrep --test .semgrep/

      - name: Scan for the project rules
        run: semgrep scan --error --config .semgrep/label-suite.yml backend/ frontend/ e2e/

      # T4, T6 (#562): integration tests and the harness files must not mock
      # this project's own modules. Semgrep skips tests/ by default, so this
      # step (S2) turns that default off with --x-ignore-semgrepignore-files,
      # and the rules' paths.include limits the scan to the integration tests,
      # conftest.py, probe.py and factories/. The flag is experimental; its
      # behaviour is guaranteed only by the pinned image above, so a new image
      # version must re-prove the scan scope in the same pull request. The
      # project-rule scan above is left unchanged.
      - name: Scan the tests for self-mocks (T4, T6)
        run: semgrep scan --error --x-ignore-semgrepignore-files --config .semgrep/test-boundaries.yml backend/

  # pip-audit 2.10.1 has no severity flag, so any known vulnerability in the
  # backend environment fails the job. pnpm audit fails on high or above in the
  # production dependencies only.
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependencies are installed, so skip the pnpm cache that
          # packageManager in package.json would otherwise turn on.
          package-manager-cache: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the backend dependencies
        run: cd backend && uv sync --locked

      - name: Audit the backend dependencies
        run: cd backend && uv run pip-audit

      - name: Audit the frontend production dependencies
        run: pnpm audit --prod --audit-level high

  # Decides which path-conditioned jobs run, one output per entry of the path
  # table in scripts/ci-changed-paths.mjs. It needs the full history for the
  # merge base; a base it cannot diff, or a change to a global trigger such as
  # this workflow or a lockfile, answers "run" for every output rather than
  # failing. The conditional jobs use `needs: changes` and a job-level `if`,
  # never a workflow-level `paths` filter, so a skipped required check still
  # reports as passing. Each `if` also runs its job when `changes` itself did
  # not succeed: a failed `changes` must not skip everything as "passing".
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.paths.outputs.code }}
      frontend: ${{ steps.paths.outputs.frontend }}
      e2e: ${{ steps.paths.outputs.e2e }}
      api_contract: ${{ steps.paths.outputs.api_contract }}
      docs_site: ${{ steps.paths.outputs.docs_site }}
      scripts: ${{ steps.paths.outputs.scripts }}
      hooks: ${{ steps.paths.outputs.hooks }}
      compose: ${{ steps.paths.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Decide which conditional jobs run
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changed-paths.mjs --base "$BASE" --head "$HEAD"

  # Builds and starts both tiers for real. Only pull requests that touch the
  # orchestration, an image, the code it runs, or a global trigger such as this
  # workflow get here (see `changes`), so it is not a required check. The production password is generated inside the job
  # and masked: the example file leaves it empty on purpose, and `${VAR:?}` rejects
  # an empty value as well as an unset one.
  compose:
    name: compose
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.compose == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `up --wait` with a one-off migrate service needs Compose v2.20.0 or newer
      # (older versions count the exited migrate container as a failure).
      - name: Check the Compose version
        run: |
          docker compose version
          version=$(docker compose version --short)
          version=${version#v}
          minimum=2.20.0
          lowest=$(printf '%s\n%s\n' "$version" "$minimum" | sort -V | head -n 1)
          if [ "$lowest" != "$minimum" ]; then
            echo "::error::Docker Compose $version is older than the required $minimum"
            exit 1
          fi

      - name: Copy the example environment file
        run: cp .env.example .env

      - name: Generate a one-off database password
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "GENERATED_POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"

      # The production tier refuses to start without AUTH_SECRET (#719,
      # login-auth-guard design D4); generated and masked the same way.
      - name: Generate a one-off auth secret
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          echo "GENERATED_AUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - name: Resolve the Lite tier
        run: docker compose config --quiet

      - name: Resolve the production tier
        run: AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml config --quiet

      # Shell variables beat .env, and an empty one trips `${VAR:?}`. If either
      # command succeeds, a required setting is no longer required.
      - name: Check that a missing allowed origin is rejected
        run: |
          if out=$(CORS_ALLOWED_ORIGINS= docker compose config --quiet 2>&1); then
            echo "::error::an empty CORS_ALLOWED_ORIGINS was accepted"
            exit 1
          fi
          echo "$out"
          grep -q CORS_ALLOWED_ORIGINS <<< "$out" || {
            echo "::error::the rejection did not name CORS_ALLOWED_ORIGINS"
            exit 1
          }

      - name: Check that a missing database password is rejected
        run: |
          if out=$(AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD= docker compose -f docker-compose.prod.yml config --quiet 2>&1); then
            echo "::error::an empty POSTGRES_PASSWORD was accepted"
            exit 1
          fi
          echo "$out"
          grep -q POSTGRES_PASSWORD <<< "$out" || {
            echo "::error::the rejection did not name POSTGRES_PASSWORD"
            exit 1
          }

      # Only AUTH_SECRET is missing here, so the rejection can only come from it.
      - name: Check that a missing AUTH_SECRET is rejected
        run: |
          if out=$(AUTH_SECRET= POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml config --quiet 2>&1); then
            echo "::error::an empty AUTH_SECRET was accepted"
            exit 1
          fi
          echo "$out"
          grep -q AUTH_SECRET <<< "$out" || {
            echo "::error::the rejection did not name AUTH_SECRET"
            exit 1
          }

      # Reads the resolved configuration; nothing is started. In both tiers only
      # the frontend publishes a port, the frontend waits for a healthy backend, and
      # the backend health check polls /api/v1/health every 30 seconds. Both tiers
      # also run redis and a worker (email-celery-worker design D11): the worker
      # uses the backend image, listens on default,scoring, gets more than 300
      # seconds to stop, waits for redis and the migration, and pings itself every
      # 30 seconds; backend and worker get REDIS_URL, RESEND_API_KEY and MAIL_FROM;
      # no service gets CELERY_TASK_ALWAYS_EAGER, although .env.example sets it for
      # `pnpm run dev`. The Lite worker mounts the backend's data volume; the
      # production worker mounts no named volume.
      - name: Assert the structure of both orchestration files
        run: |
          docker compose config --format json > "$RUNNER_TEMP/lite.json"
          AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml config --format json > "$RUNNER_TEMP/prod.json"
          for file in lite prod; do
            echo "checking the $file tier"
            jq -e '[.services | to_entries[] | select((.value.ports // []) | length > 0) | .key] == ["frontend"]' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: only frontend may publish ports"; exit 1; }
            jq -e '.services.redis != null and .services.worker != null' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: a redis and a worker service are required"; exit 1; }
            jq -e '.services.worker.image == .services.backend.image' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: worker must use the backend image"; exit 1; }
            jq -e 'def secs: capture("^((?<h>[0-9]+)h)?((?<m>[0-9]+)m)?((?<s>[0-9]+)s)?$") | ((.h // "0") | tonumber) * 3600 + ((.m // "0") | tonumber) * 60 + ((.s // "0") | tonumber); (.services.worker.stop_grace_period | secs) > 300' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: worker stop_grace_period must be more than 300 seconds"; exit 1; }
            jq -e '(.services.worker.command | join(" ") | contains("-Q default,scoring")) and (.services.worker.command | join(" ") | contains("--concurrency 2"))' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: worker must listen on default,scoring with concurrency 2"; exit 1; }
            jq -e '(.services.redis.healthcheck.test | join(" ") | contains("redis-cli ping")) and .services.worker.healthcheck.interval == "30s" and (.services.worker.healthcheck.test | join(" ") | contains("inspect ping"))' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: redis must check redis-cli ping and worker must run inspect ping every 30s"; exit 1; }
            jq -e '.services.worker.depends_on.redis.condition == "service_healthy" and .services.worker.depends_on.migrate.condition == "service_completed_successfully" and .services.backend.depends_on.redis.condition == "service_healthy"' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: worker must wait for redis and migrate, backend for redis"; exit 1; }
            jq -e '[.services.backend, .services.worker] | all(.environment.REDIS_URL == "redis://redis:6379" and (.environment | has("RESEND_API_KEY")) and (.environment | has("MAIL_FROM")))' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: backend and worker need REDIS_URL, RESEND_API_KEY and MAIL_FROM"; exit 1; }
            jq -e '[.services[] | (.environment // {}) | has("CELERY_TASK_ALWAYS_EAGER")] | any | not' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: no container may get CELERY_TASK_ALWAYS_EAGER"; exit 1; }
            jq -e '.services.frontend.depends_on.backend.condition == "service_healthy"' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: frontend must wait for a healthy backend"; exit 1; }
            jq -e '.services.backend.healthcheck.interval == "30s" and (.services.backend.healthcheck.test | join(" ") | contains("/api/v1/health"))' "$RUNNER_TEMP/$file.json" > /dev/null || { echo "::error::$file: backend health check must poll /api/v1/health every 30s"; exit 1; }
          done
          jq -e '([.services.worker.volumes[]? | select(.type == "volume" and .source == "label-suite-data" and .target == "/app/data")] | length == 1) and .services.worker.environment.SQLITE_PATH == .services.backend.environment.SQLITE_PATH' "$RUNNER_TEMP/lite.json" > /dev/null || { echo "::error::lite: worker must mount label-suite-data at /app/data with the backend's SQLITE_PATH"; exit 1; }
          jq -e '[.services.worker.volumes[]? | select(.type == "volume")] | length == 0' "$RUNNER_TEMP/prod.json" > /dev/null || { echo "::error::prod: worker must not mount a named volume"; exit 1; }

      # Trusted proxy (#566, design D2 and D4). Both tiers must pin the same fixed
      # subnet, a dynamic ip_range and a frontend address outside it, and the backend
      # must trust only that address by default. The two --env-file flags are layered
      # on purpose: one flag alone would replace the default .env and drop the required
      # ${CORS_ALLOWED_ORIGINS:?} variable before any assertion ran. Nothing is started.
      - name: Assert the trusted proxy settings of both orchestration files
        run: |
          printf 'FORWARDED_ALLOW_IPS=192.0.2.7\n' > "$RUNNER_TEMP/override.env"
          docker compose --env-file .env --env-file "$RUNNER_TEMP/override.env" config --format json > "$RUNNER_TEMP/lite-override.json"
          AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml --env-file .env --env-file "$RUNNER_TEMP/override.env" config --format json > "$RUNNER_TEMP/prod-override.json"
          grep -q 'proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;' frontend/nginx.conf || { echo "::error::nginx must append to X-Forwarded-For with \$proxy_add_x_forwarded_for"; exit 1; }
          python3 - <<'PY'
          import ipaddress
          import json
          import os
          import sys

          tmp = os.environ["RUNNER_TEMP"]
          errors = []
          POOLS = [ipaddress.ip_network("172.16.0.0/12"), ipaddress.ip_network("192.168.0.0/16")]


          def fail(message):
              errors.append(message)


          def load(name):
              with open(f"{tmp}/{name}.json") as handle:
                  return json.load(handle)


          def facts(tier):
              cfg = load(tier)
              try:
                  pool = cfg["networks"]["default"]["ipam"]["config"][0]
                  subnet = ipaddress.ip_network(pool["subnet"])
                  ip_range = ipaddress.ip_network(pool["ip_range"])
                  frontend = ipaddress.ip_address(cfg["services"]["frontend"]["networks"]["default"]["ipv4_address"])
                  allow = cfg["services"]["backend"]["environment"]["FORWARDED_ALLOW_IPS"]
              except (KeyError, IndexError, TypeError):
                  fail(f"{tier}: needs a default network with ipam subnet and ip_range, a frontend ipv4_address and a backend FORWARDED_ALLOW_IPS")
                  return None
              if not ip_range.subnet_of(subnet):
                  fail(f"{tier}: ip_range {ip_range} is not inside subnet {subnet}")
              if frontend not in subnet or frontend in ip_range:
                  fail(f"{tier}: frontend {frontend} must be in {subnet} and outside ip_range {ip_range}")
              if any(subnet.overlaps(pool) for pool in POOLS):
                  fail(f"{tier}: subnet {subnet} overlaps a Docker default address pool")
              items = [item.strip() for item in allow.split(",")]
              if allow != str(frontend):
                  fail(f"{tier}: FORWARDED_ALLOW_IPS default {allow!r} must equal the frontend address {frontend}")
              if "*" in items or any("/" in item and ipaddress.ip_network(item, strict=False).prefixlen == 0 for item in items):
                  fail(f"{tier}: FORWARDED_ALLOW_IPS must not trust everyone")
              return (str(subnet), str(ip_range), str(frontend))


          lite, prod = facts("lite"), facts("prod")
          if lite is not None and prod is not None and lite != prod:
              fail(f"the tiers must share one subnet, ip_range and frontend address: {lite} != {prod}")

          for tier in ("lite", "prod"):
              env = load(f"{tier}-override")["services"]["backend"]["environment"]
              if env.get("FORWARDED_ALLOW_IPS") != "192.0.2.7":
                  fail(f"{tier}: a FORWARDED_ALLOW_IPS in .env must override the default")
              if not env.get("CORS_ALLOWED_ORIGINS"):
                  fail(f"{tier}: the layered env files must keep CORS_ALLOWED_ORIGINS")

          for message in errors:
              print(f"::error::{message}")
          sys.exit(1 if errors else 0)
          PY

      # The browser check runs on the production tier only, but Chromium is
      # installed before the first tier starts so a slow download cannot sit
      # between a running stack and its checks.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install the e2e dependencies
        run: pnpm install --frozen-lockfile --filter e2e...

      - name: Install the Chromium browser
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Start the Lite tier
        run: docker compose up --build --wait --wait-timeout 300

      # The backend publishes no port, so this request also proves the reverse proxy.
      - name: Check the Lite health through nginx
        run: |
          body=$(curl -fsS http://localhost:8080/api/v1/health)
          echo "$body"
          jq -e '.data.status == "ok" and .data.database == "ok"' <<< "$body"

      # The worker reaches the broker (email-celery-worker design D11).
      - name: Check that the Lite worker answers a ping
        run: docker compose exec -T worker celery -A app.worker inspect ping

      - name: Check the Lite security headers
        run: scripts/check-security-headers.sh http://localhost:8080

      # Spec container-runtime "重啟後登入狀態仍有效" (login-auth-guard task 4.5): create
      # the Seeder admin, sign in through nginx, `docker compose down` without -v,
      # bring Lite back up and reuse the cookies. Same project and .env as the Lite
      # start above; AUTH_SECRET stays empty, so the secret is the one the backend
      # generated on the data volume. Lite is up again when the step ends.
      - name: Check that a Lite sign-in survives a restart
        run: scripts/check-login-survives-restart.sh http://localhost:8080

      # Stopping the backend makes nginx answer its own error page; the headers
      # must still be there (502 or 504, either is accepted).
      - name: Stop the Lite backend
        run: docker compose stop backend

      - name: Check the Lite security headers with the backend down
        run: scripts/check-security-headers.sh --backend-down http://localhost:8080

      - name: Stop the Lite tier
        run: docker compose down -v

      # Runtime proof of the trusted proxy settings (#566, design D4, P2): a complete
      # cycle of its own, after the Lite tier is down. Only the backend's command is
      # swapped, for an app that reports the client address it sees; the override
      # never touches the image or the default orchestration. Re-running `up` with
      # the override over a running Lite tier would recreate only the backend and
      # leave Nginx pointing at the old backend address (a 502), so it is not done.
      - name: Start the Lite tier with the client address probe
        run: docker compose -f docker-compose.yml -f e2e/shared/proxy-probe/compose.override.yml up --build --wait --wait-timeout 300

      - name: Check the client address the backend sees through nginx
        run: |
          frontend=$(jq -r '.services.frontend.networks.default.ipv4_address' "$RUNNER_TEMP/lite.json")
          e2e/shared/proxy-probe/check-client-address.sh http://localhost:8080 "$frontend"

      - name: Stop the Lite tier with the client address probe
        run: docker compose -f docker-compose.yml -f e2e/shared/proxy-probe/compose.override.yml down -v

      - name: Start the production tier
        run: AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml up --build --wait --wait-timeout 300

      - name: Check the production health through nginx
        run: |
          body=$(curl -fsS http://localhost:8080/api/v1/health)
          echo "$body"
          jq -e '.data.status == "ok" and .data.database == "ok"' <<< "$body"

      - name: Check that the production worker answers a ping
        run: AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml exec -T worker celery -A app.worker inspect ping

      - name: Check the production security headers
        run: scripts/check-security-headers.sh http://localhost:8080

      # Loads the page shell in a browser against the running production tier and
      # fails on a CSP violation or a failed request.
      - name: Check the public entry in a browser
        run: E2E_TARGET=compose E2E_BASE_URL=http://localhost:8080 pnpm --filter e2e test

      - name: Stop the production backend
        run: AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml stop backend

      - name: Check the production security headers with the backend down
        run: scripts/check-security-headers.sh --backend-down http://localhost:8080

      - name: Stop the production tier
        run: AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml down -v

      - name: Show the container logs
        if: failure()
        run: |
          docker compose logs --no-color || true
          docker compose -f docker-compose.yml -f e2e/shared/proxy-probe/compose.override.yml logs --no-color || true
          AUTH_SECRET="$GENERATED_AUTH_SECRET" POSTGRES_PASSWORD="$GENERATED_POSTGRES_PASSWORD" docker compose -f docker-compose.prod.yml logs --no-color || true

      - name: Upload the public entry report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-public-entry
          path: e2e/playwright-report
          if-no-files-found: ignore

  # Combines the two backend rounds (a path only PostgreSQL reaches would count
  # as uncovered in one round) and compares the result with the baseline file.
  # It also compares the PR's baseline with the base branch's, so a PR cannot
  # lower coverage by editing the baseline; a maintainer's coverage-baseline-lower
  # label is the one exception. Adding or removing the label reruns the workflow
  # (on.pull_request.types). The job only reads the repository: the suggested
  # baseline is uploaded, never committed.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [changes, backend-sqlite, backend-postgres, frontend]
    # The three test jobs must have succeeded, as before; a failed one is already
    # a red required check, and its coverage data is missing anyway.
    if: >-
      ${{ !cancelled()
      && needs.backend-sqlite.result == 'success'
      && needs.backend-postgres.result == 'success'
      && needs.frontend.result == 'success'
      && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install the locked backend dependencies
        run: cd backend && uv sync --locked

      # The base branch has no baseline file only in the pull request that creates
      # it; the script then prints a notice and skips the "not lowered" check.
      - name: Read the base branch baseline
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/${BASE_REF}:coverage-baseline.json" > "$RUNNER_TEMP/base-coverage-baseline.json"; then
            echo "Read coverage-baseline.json from origin/${BASE_REF}"
          else
            rm -f "$RUNNER_TEMP/base-coverage-baseline.json"
            echo "::notice::origin/${BASE_REF} has no coverage-baseline.json"
          fi

      - name: Download the SQLite coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-backend-sqlite
          path: backend

      - name: Download the PostgreSQL coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-backend-postgres
          path: backend

      - name: Download the frontend coverage summary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-frontend
          path: frontend/coverage

      # Both data files record paths under backend/ of the runner's checkout, which
      # is where this job checks out too, so the sources resolve.
      - name: Combine the backend coverage data
        working-directory: backend
        run: uv run coverage combine .coverage.sqlite .coverage.postgres

      - name: Export the backend coverage as JSON
        working-directory: backend
        run: uv run coverage json -o coverage.json

      - name: Compare with the coverage baseline
        env:
          ALLOW_LOWER: ${{ contains(github.event.pull_request.labels.*.name, 'coverage-baseline-lower') }}
        run: |
          args=(
            --backend backend/coverage.json
            --frontend frontend/coverage/coverage-summary.json
            --baseline coverage-baseline.json
            --suggested-out coverage-baseline-suggested.json
          )
          if [ -f "$RUNNER_TEMP/base-coverage-baseline.json" ]; then
            args+=(--base-baseline "$RUNNER_TEMP/base-coverage-baseline.json")
          fi
          if [ "$ALLOW_LOWER" = "true" ]; then
            args+=(--allow-lower)
          fi
          node scripts/check-coverage.mjs "${args[@]}"

      # Authentication and authorization paths need 90% branch coverage in each
      # tier, from the same combined backend data and frontend summary
      # (login-auth-guard task 9.1, design D10; the list is critical-coverage.json).
      - name: Check the critical-path branch coverage
        run: node scripts/check-critical-coverage.mjs --list critical-coverage.json --backend backend/coverage.json --frontend frontend/coverage/coverage-summary.json

      # Uploaded after a failure too: a missing baseline fails the comparison but
      # still writes the suggested file, which is how the first baseline is made.
      - name: Upload the suggested baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-baseline-suggested
          path: coverage-baseline-suggested.json
          if-no-files-found: ignore

  # Needs only `changes`, never a test job, so a broken script or a skipped CI
  # check is reported even when a backend job fails (design D11). It runs when
  # scripts/ or a global trigger (this workflow included) changed.
  scripts-tests:
    name: scripts-tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Script and workflow tests
        run: |
          node --test \
            scripts/tests/check-coverage.test.mjs \
            scripts/tests/check-critical-coverage.test.mjs \
            scripts/tests/check-junit-skips.test.mjs \
            scripts/tests/check-security-headers.test.mjs \
            scripts/tests/ci-changed-paths.test.mjs \
            scripts/tests/check.test.mjs \
            scripts/tests/dev.test.mjs \
            scripts/tests/ci-workflow.test.mjs

  # The same suites on Windows. A separate job rather than a matrix cell, so
  # the required `scripts-tests` check keeps its name and a Windows failure does
  # not gate merging (maintainer ruling on #824); it reports only.
  scripts-tests-windows:
    name: scripts-tests-windows
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.scripts == 'true') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Script and workflow tests
        run: |
          node --test \
            scripts/tests/check-coverage.test.mjs \
            scripts/tests/check-critical-coverage.test.mjs \
            scripts/tests/check-junit-skips.test.mjs \
            scripts/tests/check-security-headers.test.mjs \
            scripts/tests/ci-changed-paths.test.mjs \
            scripts/tests/check.test.mjs \
            scripts/tests/dev.test.mjs \
            scripts/tests/ci-workflow.test.mjs
