<!-- @dsCard group="Forms" height=470 -->
<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  .ds-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  /* the popover is absolutely positioned under its trigger; keep it in flow so the card sizes to it */
  .ds-cell .date-range-popover { position: static; margin-top: 4px; }
  .date-range-nav-prev svg, .date-range-nav-next svg { display: block; }
</style>
</head>
<body>
  <div class="ds-stage" style="align-items: flex-start;">
    <div class="ds-cell">
      <button type="button" class="date-range-trigger" aria-haspopup="dialog" aria-expanded="false"><span class="date-range-trigger-text">選擇日期區間</span></button>
      <span class="ds-caption">收合，未選</span>
    </div>
    <div class="ds-cell">
      <button type="button" class="date-range-trigger" aria-haspopup="dialog" aria-expanded="false"><span class="date-range-trigger-text">2026-11-09 ～ 不限</span></button>
      <span class="ds-caption">單端開放區間</span>
    </div>
    <div class="ds-cell" style="position: relative;">
      <button type="button" class="date-range-trigger" aria-haspopup="dialog" aria-controls="drpDemoPopover" aria-expanded="true"><span class="date-range-trigger-text">2026-11-09 ～ 2026-11-13</span></button>
      <div class="date-range-popover" id="drpDemoPopover" role="dialog" aria-modal="false" aria-label="選擇日期區間">
        <div class="date-range-popover-header">
          <button type="button" class="date-range-nav-prev" aria-label="上個月"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6" transform="rotate(180 12 12)"></polyline></svg></button>
          <span class="date-range-month-label">2026年11月</span>
          <button type="button" class="date-range-nav-next" aria-label="下個月"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        </div>
        <table class="date-range-grid" role="grid"><tbody>
          <tr role="row"><td><button type="button" class="date-range-day" data-date="2026-11-01" tabindex="-1" role="gridcell">1</button></td><td><button type="button" class="date-range-day" data-date="2026-11-02" tabindex="-1" role="gridcell">2</button></td><td><button type="button" class="date-range-day" data-date="2026-11-03" tabindex="-1" role="gridcell">3</button></td><td><button type="button" class="date-range-day" data-date="2026-11-04" tabindex="-1" role="gridcell">4</button></td><td><button type="button" class="date-range-day" data-date="2026-11-05" tabindex="-1" role="gridcell">5</button></td><td><button type="button" class="date-range-day" data-date="2026-11-06" tabindex="-1" role="gridcell">6</button></td><td><button type="button" class="date-range-day" data-date="2026-11-07" tabindex="-1" role="gridcell">7</button></td></tr>
          <tr role="row"><td><button type="button" class="date-range-day" data-date="2026-11-08" tabindex="-1" role="gridcell">8</button></td><td><button type="button" class="date-range-day is-range-start" data-date="2026-11-09" tabindex="0" role="gridcell" aria-selected="true">9</button></td><td><button type="button" class="date-range-day is-in-range" data-date="2026-11-10" tabindex="-1" role="gridcell">10</button></td><td><button type="button" class="date-range-day is-in-range" data-date="2026-11-11" tabindex="-1" role="gridcell">11</button></td><td><button type="button" class="date-range-day is-in-range" data-date="2026-11-12" tabindex="-1" role="gridcell">12</button></td><td><button type="button" class="date-range-day is-range-end" data-date="2026-11-13" tabindex="-1" role="gridcell" aria-selected="true">13</button></td><td><button type="button" class="date-range-day" data-date="2026-11-14" tabindex="-1" role="gridcell">14</button></td></tr>
          <tr role="row"><td><button type="button" class="date-range-day" data-date="2026-11-15" tabindex="-1" role="gridcell">15</button></td><td><button type="button" class="date-range-day" data-date="2026-11-16" tabindex="-1" role="gridcell">16</button></td><td><button type="button" class="date-range-day" data-date="2026-11-17" tabindex="-1" role="gridcell">17</button></td><td><button type="button" class="date-range-day is-today" data-date="2026-11-18" tabindex="-1" role="gridcell">18</button></td><td><button type="button" class="date-range-day" data-date="2026-11-19" tabindex="-1" role="gridcell">19</button></td><td><button type="button" class="date-range-day" data-date="2026-11-20" tabindex="-1" role="gridcell">20</button></td><td><button type="button" class="date-range-day" data-date="2026-11-21" tabindex="-1" role="gridcell">21</button></td></tr>
          <tr role="row"><td><button type="button" class="date-range-day" data-date="2026-11-22" tabindex="-1" role="gridcell">22</button></td><td><button type="button" class="date-range-day" data-date="2026-11-23" tabindex="-1" role="gridcell">23</button></td><td><button type="button" class="date-range-day" data-date="2026-11-24" tabindex="-1" role="gridcell">24</button></td><td><button type="button" class="date-range-day" data-date="2026-11-25" tabindex="-1" role="gridcell">25</button></td><td><button type="button" class="date-range-day" data-date="2026-11-26" tabindex="-1" role="gridcell">26</button></td><td><button type="button" class="date-range-day" data-date="2026-11-27" tabindex="-1" role="gridcell">27</button></td><td><button type="button" class="date-range-day" data-date="2026-11-28" tabindex="-1" role="gridcell">28</button></td></tr>
          <tr role="row"><td><button type="button" class="date-range-day" data-date="2026-11-29" tabindex="-1" role="gridcell">29</button></td><td><button type="button" class="date-range-day" data-date="2026-11-30" tabindex="-1" role="gridcell">30</button></td><td></td><td></td><td></td><td></td><td></td></tr>
        </tbody></table>
        <div class="date-range-popover-footer"><button type="button" class="date-range-clear">清除</button></div>
      </div>
    </div>
  </div>
</body>
</html>
