# Dependabot only edits dependency declarations and lockfiles; the project
# version fields (CITATION.cff, backend/pyproject.toml, frontend/package.json)
# are never touched (AGENTS.md Hard Rule 4). Security updates are switched on
# in the repository settings and ignore the schedule and limit below.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      uv:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  # pnpm projects use the npm ecosystem; the root holds pnpm-lock.yaml and the
  # pnpm workspace (frontend, e2e).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
