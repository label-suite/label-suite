schema: spec-driven

context: |
  Two layers of specification:
  - docs/00-prd.mdx and docs/specs/NNN-*.mdx describe what the product does and why.
    The maintainer owns them; do not change a requirement there from an OpenSpec change.
  - openspec/specs/ is the testable contract for implementation and tests. Change it
    only through a change's spec deltas.
  Every requirement in a delta must trace to a docs/ spec (cite its FR / AC ID). When
  a delta and docs/ disagree, docs/ wins: stop and raise the conflict as an open question
  for the maintainer instead of choosing one side.
  Language: write artifacts in Traditional Chinese; keep OpenSpec structural headings
  and the SHALL / MUST keywords in English (see the Language Rules in AGENTS.md).
  Run the CLI as `npx openspec`.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
