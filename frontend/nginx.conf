# Server block for the frontend image, copied to
# /etc/nginx/conf.d/default.conf by frontend/Dockerfile. This container is the
# only service that publishes a host port, so it serves the production build,
# forwards /api/v1/ to the backend over the Compose network, and is the place
# where the response security headers are set (system-design D6, ADR-008 D1).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The version tells a client nothing it needs and tells an attacker which
    # advisories to try.
    server_tokens off;

    # Security headers, set once at server level. `always` is required: without
    # it nginx drops them from error responses, including the backend's 4xx and
    # 5xx envelopes. Keep every add_header in this file at server level - a
    # location block with its own add_header stops inheriting these.
    #
    # The expected values live in scripts/check-security-headers.sh, which the
    # compose CI job runs against both tiers (#568 system-design D4); change a
    # value here and the script in the same change.
    #
    # No Strict-Transport-Security: HSTS is the TLS edge's job (#568
    # clarification Q1). Sending it unconditionally would pin HSTS on a whole
    # domain behind a proxy such as Cloudflare, and sending it only over HTTPS
    # would mean trusting X-Forwarded-Proto. The backend now trusts X-Forwarded-For
    # and X-Forwarded-Proto only from this container's pinned address (#566); the
    # forwarding below is unchanged, and behind a TLS edge the backend still sees
    # the scheme as http.
    add_header X-Content-Type-Options "nosniff" always;
    # SAMEORIGIN, matching frame-ancestors 'self' below: spec 04-02 shows its
    # PDF guide in a same-origin iframe; other sites still cannot frame the app.
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Enforced, with no report endpoint (#568 clarification Q2, system-design D0).
    # - connect-src 'self' holds only while the image is built with
    #   VITE_API_BASE_URL="" (same-origin API calls, frontend/Dockerfile). A
    #   build that calls a cross-origin API must add that origin to connect-src,
    #   and to the expected value in scripts/check-security-headers.sh, in the
    #   same change, or every API call is blocked with no message on screen.
    # - The Vite dev server does not go through nginx, so it sends no CSP: a
    #   policy breakage shows only on a build served from here (N3).
    # - form-action 'self' also covers redirects after a form submit: if spec
    #   01-01's Google sign-in posts a form that the backend answers with a 302
    #   to Google, it is blocked here; that change must relax this directive and
    #   update the script.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # same-origin cuts a popup off from its opener: if spec 01-01's Google
    # sign-in is built as a popup, it breaks here; that change must relax this
    # header and update scripts/check-security-headers.sh.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The backend publishes no host port, so this is the only way in
    # (system-design D6). proxy_pass carries no URI part, so the original
    # /api/v1/... path reaches the backend unchanged. The upstream name is
    # resolved when nginx starts, which is why both orchestration files start
    # this service only after the backend is healthy (system-design D5).
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Session cookies are httpOnly and issued by the backend
        # (security-agent-rules S2); no API response is buffered or cached here.
        proxy_buffering off;
    }

    # Client-side routing: a path that is not a file falls back to the app
    # shell, which lets React Router resolve it (spec container-runtime, the
    # scenario where a non-file path returns the frontend page).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
