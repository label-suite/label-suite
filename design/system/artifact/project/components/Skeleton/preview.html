<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  /* showcase chrome (components-showcase.html .demo-col), not canonical */
  .demo-col { flex: 1 1 240px; min-width: 240px; display: grid; gap: 10px; align-content: start; }
</style>
</head>
<body>
<div class="ds-stage" style="align-items: flex-start;">
    <div class="demo-col">
      <span class="ds-caption">A pulse：卡片／清單版面</span>
      <div class="skeleton-stack" aria-live="polite" aria-busy="true">
        <div class="skeleton-card">
          <div class="skeleton-line title"></div>
          <div class="skeleton-line body"></div>
          <div class="skeleton-line body short"></div>
        </div>
      </div>
    </div>
    <div class="demo-col" aria-live="polite" aria-busy="true">
      <span class="ds-caption">B shimmer：表單版面</span>
      <div class="skeleton skel-avatar"></div>
      <div class="skeleton skel-line"></div>
      <div class="skeleton skel-input"></div>
      <div class="skeleton skel-btn"></div>
    </div>
  </div>
</body>
</html>
