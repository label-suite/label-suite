<!-- @dsCard group="Data display" height=310 -->
<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  /* showcase chrome (components-showcase.html .metric-grid), not canonical */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: var(--space-md); width: 100%; }
  .metric-grid .metric span, .metric-grid .metric strong { display: block; }
  .ds-lg { max-width: 220px; }
</style>
</head>
<body>
<div class="ds-stage">
    <div class="metric-grid">
      <div class="metric"><span>已完成任務</span><strong>128</strong></div>
      <div class="metric"><span>平均 IAA</span><strong>0.82</strong></div>
      <div class="metric"><span>進行中批次</span><strong>6</strong></div>
      <div class="metric"><span>待審項目</span><strong>42</strong><div class="metric-desc">比上週少 8 筆</div></div>
    </div>
    <div class="metric metric-lg ds-lg"><span>整體完成率</span><strong>87%</strong></div>
  </div>
</body>
</html>
