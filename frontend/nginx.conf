# Server block for the frontend image, copied to
# /etc/nginx/conf.d/default.conf by frontend/Dockerfile. This container is the
# only service that publishes a host port, so it serves the production build,
# forwards /api/v1/ to the backend over the Compose network, and is the place
# where the response security headers are set (system-design D6, ADR-008 D1).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The version tells a client nothing it needs and tells an attacker which
    # advisories to try.
    server_tokens off;

    # Security headers, set once at server level. `always` is required: without
    # it nginx drops them from error responses, including the backend's 4xx and
    # 5xx envelopes. Keep every add_header in this file at server level - a
    # location block with its own add_header stops inheriting these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The backend publishes no host port, so this is the only way in
    # (system-design D6). proxy_pass carries no URI part, so the original
    # /api/v1/... path reaches the backend unchanged. The upstream name is
    # resolved when nginx starts, which is why both orchestration files start
    # this service only after the backend is healthy (system-design D5).
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Session cookies are httpOnly and issued by the backend
        # (security-agent-rules S2); no API response is buffered or cached here.
        proxy_buffering off;
    }

    # Client-side routing: a path that is not a file falls back to the app
    # shell, which lets React Router resolve it (spec container-runtime, the
    # scenario where a non-file path returns the frontend page).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
