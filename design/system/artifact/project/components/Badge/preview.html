<!-- @dsCard group="Data display" height=240 -->
<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  .ds-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
  .ds-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
</style>
</head>
<body>
<div class="ds-stage">
    <div class="ds-group">
      <span class="ds-caption">任務狀態</span>
      <div class="ds-row">
        <span class="badge badge-draft">草稿</span>
        <span class="badge badge-dry-run-status">試標中</span>
        <span class="badge badge-iaa">審核中</span>
        <span class="badge badge-in-progress">進行中</span>
        <span class="badge badge-completed">已完成</span>
        <span class="badge badge-error">已退回</span>
      </div>
    </div>
    <div class="ds-group">
      <span class="ds-caption">角色（藥丸）</span>
      <div class="ds-row">
        <span class="badge badge-role">審核員</span>
      </div>
    </div>
    <div class="ds-group">
      <span class="ds-caption">任務型別</span>
      <div class="ds-row">
        <span class="badge badge-task-type-single">單一標籤</span>
        <span class="badge badge-task-type-scoring">單維度</span>
        <span class="badge badge-task-type-sequence">序列標註</span>
        <span class="badge badge-task-type-relation">關係識別</span>
        <span class="badge badge-task-type-pairs">自由文字</span>
        <span class="badge badge-task-type-default">其他</span>
      </div>
    </div>
  </div>
</body>
</html>
