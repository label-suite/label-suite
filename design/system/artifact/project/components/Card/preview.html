<!-- @dsCard group="Layout" height=430 -->
<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  .ds-stage { flex-direction: column; align-items: stretch; gap: 8px; max-width: 640px; }
  .ds-body { margin: 0; color: var(--color-text-soft); font-size: 14px; }
</style>
</head>
<body>
  <div class="ds-stage">
    <span class="ds-caption">.panel：標題 + 副標 + 內容</span>
    <article class="panel">
      <div class="panel-header">
        <div>
          <h2 class="panel-title">開始你的第一個工作流程</h2>
          <span class="panel-subtitle">從三個行動入口開始，快速達成第一個可交付成果</span>
        </div>
      </div>
      <p class="ds-body">建立任務、上傳資料集、邀請標記員。</p>
    </article>
    <span class="ds-caption">載入中：卡片內放 Skeleton，不另做卡片載入態</span>
    <article class="panel" aria-busy="true">
      <div class="skeleton-stack" aria-live="polite">
        <div class="skeleton-line title"></div>
        <div class="skeleton-line body"></div>
        <div class="skeleton-line body short"></div>
      </div>
    </article>
  </div>
</body>
</html>
