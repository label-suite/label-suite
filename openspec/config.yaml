schema: spec-driven

context: |
  規格分兩層：
  - docs/specs/（00-prd.mdx、glossary.mdx、NN-<module>/NN-<page>.mdx）描述產品做什麼、
    為什麼這樣做，只寫業務面。由維護者擁有；不得透過 OpenSpec change 更動其中的需求。
  - openspec/specs/ 是實作與測試依循的可測契約，只能透過 change 的 spec delta 修改。
    技術細節（API、資料模型、權限實作，以及測試集答案不外露的後端做法）寫在這一層。
  delta 中的每條 requirement 都須追溯到 docs/specs/ 的規格（註明規格編號 NN-NN 與
  Scenario 名稱，例：「來源：01-02 停用使用者」）。delta 與 docs/specs/ 不一致時以
  docs/specs/ 為準：停下來，把衝突列為待維護者回答的問題，不得自行選邊。
  AGENTS.md 是唯一的規則來源；以下只指出 OpenSpec 工作最常用到的段落，動手前先讀該段落。
  - Issue first：沒有列出工作項目的 open issue 就不開始 change
    （AGENTS.md "Hard Rules" 與 "Development Workflow"）。
  - 分支與 commit：不得直接 commit 到 main；commit message 依 AGENTS.md "Commits"，
    完整規則見 docs/development/commit-and-release.md。
  - 語言：artifact 以繁體中文撰寫；OpenSpec 結構標題與 SHALL／MUST 關鍵字維持英文
    （AGENTS.md "Language Rules"）。
  CLI 以 `npx openspec` 執行。

# 個別 artifact 規則（選用）
# 為特定 artifact 加上自訂規則。
# 範例：
#   rules:
#     proposal:
#       - proposal 不超過 500 字
#       - 一律說明不在範圍內的事項
#     tasks:
#       - 每個 task 拆到 2 小時以內

# 個別操作指引（選用）
# 說明 apply 與 archive 該如何進行的建議，與上方的 artifact 規則分開。
# 範例：
#   operations:
#     apply:
#       guidance:
#         - 測試摘要保持簡短
#     archive:
#       guidance:
#         - 結束前先摘要歸檔結果
