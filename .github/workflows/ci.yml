name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-messages:
    name: commit-messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checker regression tests
        run: scripts/tests/check-commit-msg-tests.sh

      - name: Check every commit in the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if ! scripts/check-commit-msg.sh "$RUNNER_TEMP/msg.txt"; then
              echo "::error::commit $sha has an invalid message (details above)"
              failed=1
            fi
          done
          exit "$failed"

  docs-site:
    name: docs-site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # notecraftapp needs Node 22 or newer.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # notecraftapp downloads its own app bundle and installs that bundle's
      # dependencies under ~/.notecraft the first time it runs. Issue #148 is the
      # record of exactly that install failing on a registry hiccup, so the
      # bundle is cached between runs: without the cache, every pull request
      # would depend on the registry being healthy at that moment.
      - name: Cache the notecraft app bundle
        uses: actions/cache@v4
        with:
          path: ~/.notecraft
          key: notecraft-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            notecraft-${{ runner.os }}-

      # The build is the only gate that catches an MDX compile error; check-specs
      # has passed three times on a page the build then refused.
      #
      # No retry here on purpose. This step used to run the build twice
      # (`... || ...`) because of issue #172, where the first --rebuild after an
      # edit fails intermittently. That bug's root cause turned out to be a
      # local `notecraftapp serve docs` watcher racing a manual build over the
      # same `.astro/` directory, with no lock between the two processes. CI
      # never runs `serve`, so it cannot hit it: the docs-site job's first
      # attempt has not failed once in the six runs checked on 2026-11-12, nor
      # in the clean-checkout run recorded on the issue. Retrying would only
      # mask a build that genuinely fails twice -- the second row of the
      # warning table in the issue itself.
      - name: Build the docs site
        run: pnpm exec notecraftapp build docs --rebuild

  specs:
    name: specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          # No dependencies are installed, so skip the pnpm cache that
          # packageManager in package.json would otherwise turn on.
          package-manager-cache: false

      - name: Checker regression tests
        run: node --test scripts/tests/check-specs.test.mjs

      - name: Flow checker regression tests
        run: node --test scripts/tests/check-flows.test.mjs

      - name: Prototype server tests
        run: node --test scripts/tests/serve-prototype.test.mjs

      - name: Check PRD and module specs
        run: node scripts/check-specs.mjs docs

      - name: Check the business flow diagrams
        run: node scripts/check-flows.mjs

      - name: ER data checker regression tests
        run: node --test scripts/tests/check-er-data.test.mjs

      - name: Check the candidate table dictionary against the ER diagram
        run: node scripts/check-er-data.mjs
