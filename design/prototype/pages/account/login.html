<!DOCTYPE html>
<!-- Spec: specs/account/001-login-email-password/spec.md, specs/account/002-login-google-sso/spec.md -->
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="../../assets/logo/icon-colored.svg">
  <title>Label Suite — 登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/tokens.css" />
  <style>
    /* ── Reset ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: var(--font-sans);
      background: var(--color-surface);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* 改載 tokens.css（G-03）前本頁沒有設 line-height；保留原本的行高，排版不變 */
    html[lang] body { line-height: normal; }

    /* ── Navbar ─────────────────────────────────────────────────── */
    .navbar {
      height: 64px;
      background: var(--color-white);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .navbar-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .navbar-logo svg {
      width: 20px;
      height: 20px;
    }
    .navbar-wordmark {
      font-family: 'Crimson Pro', serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--color-ink);
      line-height: 1;
    }
    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 6px 12px;
      background: var(--color-white);
      color: var(--color-ink);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .lang-toggle:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-soft-bg);
    }
    .lang-toggle svg { flex-shrink: 0; }

    /* ── Main ───────────────────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    /* ── Card ───────────────────────────────────────────────────── */
    .card {
      background: var(--color-white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 40px 40px 36px;
      width: 100%;
      max-width: 480px;
    }

    /* ── Card Header ────────────────────────────────────────────── */
    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .card-logo {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      flex-shrink: 0;
      background: var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-logo svg {
      width: 30px;
      height: 30px;
    }
    .card-title {
      font-family: 'Crimson Pro', serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--color-ink);
      line-height: 1.2;
    }
    .card-subtitle {
      font-size: 15px;
      color: var(--color-ink-muted);
      line-height: 1.5;
    }

    /* ── Error Banner ───────────────────────────────────────────── */
    .error-banner {
      display: none;
      align-items: flex-start;
      gap: 8px;
      background: var(--color-error-bg);
      border: 1px solid var(--color-error-border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--color-error);
      line-height: 1.4;
    }
    .error-banner.visible { display: flex; }
    .error-banner svg { flex-shrink: 0; margin-top: 1px; }

    /* ── Google SSO Button ──────────────────────────────────────── */
    .sso-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 11px 16px;
      background: var(--color-white);
      color: var(--color-ink);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .sso-btn:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-soft-bg);
    }

    /* ── Divider ────────────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--color-ink-muted);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    /* ── Form ───────────────────────────────────────────────────── */
    .form { display: flex; flex-direction: column; gap: 16px; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-ink);
    }
    .forgot-link {
      font-size: 13px;
      color: var(--color-primary-strong);
      text-decoration: none;
      font-weight: 500;
    }
    .forgot-link:hover { text-decoration: underline; }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 12px;
      color: var(--color-ink-muted);
      pointer-events: none;
      display: flex;
      align-items: center;
    }
    .input-wrapper input {
      width: 100%;
      border: 1px solid var(--color-border-control);
      border-radius: var(--radius-md);
      padding: 9px 40px 9px 40px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--color-ink);
      background: var(--color-white);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .input-wrapper input::placeholder { color: var(--color-ink-muted); }
    .input-wrapper input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .input-wrapper input.error {
      border-color: var(--color-error);
      box-shadow: 0 0 0 3px rgba(185,28,28,0.08);
    }
    .field-error {
      font-size: 12px;
      color: var(--color-error);
      display: none;
    }
    .field-error.visible { display: block; }

    .eye-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-ink-muted);
      display: flex;
      align-items: center;
      padding: 2px;
      border-radius: var(--radius-sm);
      transition: color 0.15s;
    }
    .eye-toggle:hover { color: var(--color-ink); }
    .eye-toggle:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 1px;
    }

    /* ── Login Button ───────────────────────────────────────────── */
    .login-btn {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--color-cta);
      color: var(--color-on-cta);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
      margin-top: 4px;
    }
    .login-btn:hover { background: var(--color-cta-hover); }
    .login-btn:active { transform: translateY(1px); }
    .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .login-btn:focus-visible { outline: 2px solid var(--color-cta); outline-offset: 2px; }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2.5px solid color-mix(in srgb, var(--color-on-cta) 40%, transparent);
      border-top-color: var(--color-on-cta);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Register Link ──────────────────────────────────────────── */
    .register-row {
      text-align: center;
      font-size: 13px;
      color: var(--color-ink-muted);
      margin-top: 4px;
    }
    .register-row a {
      color: var(--color-primary-strong);
      text-decoration: none;
      font-weight: 500;
    }
    .register-row a:hover { text-decoration: underline; }


    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 767px) {
      .navbar { height: 56px; padding: 0 16px; }
      .navbar-logo { width: 28px; height: 28px; border-radius: 7px; }
      .navbar-wordmark { font-size: 16px; }
      .main { padding: 24px 16px; align-items: flex-start; }
      .card { padding: 28px 20px 24px; border-radius: var(--radius-lg); }
      .card-logo { width: 52px; height: 52px; border-radius: 13px; }
    }

    /* ── Accessibility ──────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

  </style>
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────────── -->
  <header class="navbar" role="banner">
    <a class="navbar-brand" href="#" aria-label="Label Suite 首頁">
      <!-- Logo 32×32 -->
      <div class="navbar-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--color-on-cta)">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="7" y1="7" x2="7.01" y2="7"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="navbar-wordmark">Label Suite</span>
    </a>
    <button class="lang-toggle" id="langToggle" data-testid="lang-toggle" aria-label="切換語言" type="button">
      <!-- Globe icon -->
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span id="langLabel" data-testid="lang-label">ZH</span>
    </button>
  </header>

  <!-- ── Main ───────────────────────────────────────────────────── -->
  <main class="main" role="main">
    <div class="card" role="region" aria-label="登入">

      <!-- Card Header -->
      <div class="card-header">
        <!-- Logo 56×56 -->
        <div class="card-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--color-on-cta)">
            <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="7" y1="7" x2="7.01" y2="7"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 class="card-title">Label Suite</h1>
        <p class="card-subtitle" id="subtitle">登入你的帳號</p>
      </div>

      <!-- Error Banner -->
      <div class="error-banner" id="errorBanner" role="alert" aria-live="assertive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorMsg">帳號或密碼錯誤，請再試一次</span>
      </div>

      <!-- Google SSO -->
      <button class="sso-btn" type="button" id="ssoBtn" data-testid="google-login-btn" aria-label="使用 Google 帳號繼續登入">
        <!-- Google G icon -->
        <img src="../../assets/google-g.svg" width="18" height="18" alt="" aria-hidden="true" />
        <span id="ssoText">使用 Google 帳號繼續</span>
      </button>

      <!-- Divider -->
      <div class="divider"><span id="dividerText">或</span></div>

      <!-- Form -->
      <form class="form" id="loginForm" novalidate>

        <!-- Email field -->
        <div class="field">
          <label for="email" id="emailLabel">電子郵件</label>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              data-testid="email-input"
              placeholder="name@example.com"
              autocomplete="email"
              aria-describedby="emailError"
            />
          </div>
          <span class="field-error" id="emailError" data-testid="email-error" role="alert"></span>
        </div>

        <!-- Password field -->
        <div class="field">
          <div class="field-label-row">
            <label for="password" id="passwordLabel">密碼</label>
            <a href="./forgot-password.html" class="forgot-link" id="forgotLink" data-testid="forgot-password-link">忘記密碼？</a>
          </div>
          <div class="input-wrapper">
            <span class="input-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              data-testid="password-input"
              placeholder="••••••••"
              autocomplete="current-password"
              aria-describedby="passwordError"
            />
            <button type="button" class="eye-toggle" id="eyeToggle" aria-label="顯示密碼">
              <!-- Eye-off icon (default — password hidden) -->
              <svg id="eyeOff" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
              <!-- Eye icon (shown when password visible) -->
              <svg id="eyeOn" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="passwordError" data-testid="password-error" role="alert"></span>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn" id="loginBtn" data-testid="login-btn">
          <span id="loginBtnText">登入</span>
        </button>

        <!-- Register row -->
        <p class="register-row">
          <span id="registerText">還沒有帳號？</span>
          <a href="./register.html" id="registerLink" data-testid="register-link"> 前往註冊</a>
        </p>
      </form>

    </div>
  </main>

  <script src="../shared/sidebar.js"></script>
  <script>
    /* label-suite/label-suite#195（規格 01-01 Q3）：已登入的人直接開這一頁 →
       直接前往儀表板，不顯示本頁。四頁都做，因為 01-02 `:37` 與 01-03 `:37`
       各自寫了「比照 01-01 Q3」。演示用的逃生口見 sidebar.js 的
       redirectIfLoggedIn()：`?sim_logged_out=1` 強制留下、`?sim_logged_in=1`
       強制導走。放在這裡（而不是 DOMContentLoaded）是為了在畫面畫出來之前
       就決定，避免閃一下本頁再跳走。 */
    window.LabelSuiteSharedSidebar.redirectIfLoggedIn('../dashboard/dashboard.html');
  </script>
  <script src="../../assets/analytics.js"></script>
  <script>
    window.LabelSuiteAnalytics.init({
      page: 'login',
    });

    /* ── i18n ──────────────────────────────────────────────────── */
    const i18n = {
      zh: {
        pageTitle:    'Label Suite — 登入',
        langLabel:    'ZH',
        subtitle:     '登入你的帳號',
        ssoText:      '使用 Google 帳號繼續',
        dividerText:  '或',
        emailLabel:   '電子郵件',
        emailPlaceholder: 'name@example.com',
        passwordLabel: '密碼',
        forgotLink:   '忘記密碼？',
        loginBtnText: '登入',
        registerText: '還沒有帳號？',
        registerLink: ' 前往註冊',
        errorMsg:     '帳號或密碼錯誤，請再試一次',
        emailRequired:    '請輸入電子郵件',
        passwordRequired: '請輸入密碼',
        cardRegion:   '登入',
        eyeShow:      '顯示密碼',
        eyeHide:      '隱藏密碼',
        ssoAriaLabel:      '使用 Google 帳號繼續登入',
        navAriaLabel:      'Label Suite 首頁',
        langToggleAria:    '切換語言',
      },
      en: {
        pageTitle:    'Label Suite — Sign In',
        langLabel:    'EN',
        subtitle:     'Sign in to your account',
        ssoText:      'Continue with Google',
        dividerText:  'or',
        emailLabel:   'Email',
        emailPlaceholder: 'name@example.com',
        passwordLabel: 'Password',
        forgotLink:   'Forgot password?',
        loginBtnText: 'Sign In',
        registerText: "Don't have an account?",
        registerLink: ' Register',
        errorMsg:     'Invalid email or password',
        emailRequired:    'Email is required',
        passwordRequired: 'Password is required',
        cardRegion:   'Sign in',
        eyeShow:      'Show password',
        eyeHide:      'Hide password',
        ssoAriaLabel:      'Continue with Google account',
        navAriaLabel:      'Label Suite home',
        langToggleAria:    'Switch language',
      },
    };

    let lang = window.LabelSuiteSharedSidebar.getStoredLang();
    const getTrackingContext = () => ({ lang });

    function applyLang(l) {
      const nextLang = l === 'en' ? 'en' : 'zh';
      const t = i18n[nextLang];
      lang = window.LabelSuiteSharedSidebar.applyGlobalLanguage(nextLang, {
        langToggleAria: t.langToggleAria,
        labelIds: ['langLabel'],
        toggleIds: ['langToggle'],
      });
      document.title                              = t.pageTitle;
      document.getElementById('subtitle').textContent    = t.subtitle;
      document.getElementById('ssoText').textContent     = t.ssoText;
      document.getElementById('dividerText').textContent = t.dividerText;
      document.getElementById('emailLabel').textContent  = t.emailLabel;
      document.getElementById('email').placeholder       = t.emailPlaceholder;
      document.getElementById('passwordLabel').textContent = t.passwordLabel;
      document.getElementById('forgotLink').textContent  = t.forgotLink;
      const loginBtnTextEl = document.getElementById('loginBtnText');
      if (loginBtnTextEl) loginBtnTextEl.textContent = t.loginBtnText;
      document.getElementById('registerText').textContent = t.registerText;
      document.getElementById('registerLink').textContent = t.registerLink;
      document.getElementById('errorMsg').textContent    = t.errorMsg;
      document.getElementById('ssoBtn').setAttribute('aria-label', t.ssoAriaLabel);
      document.querySelector('.navbar-brand').setAttribute('aria-label', t.navAriaLabel);
      document.querySelector('[role="region"]').setAttribute('aria-label', t.cardRegion);
      // update eye toggle aria-label based on current visibility state
      const pwVisible = document.getElementById('password').type === 'text';
      document.getElementById('eyeToggle').setAttribute('aria-label', pwVisible ? t.eyeHide : t.eyeShow);
    }

    document.getElementById('langToggle').addEventListener('click', () => {
      const previousLang = lang;
      lang = lang === 'zh' ? 'en' : 'zh';
      applyLang(lang);
      // clear errors on language switch
      clearErrors();
      window.LabelSuiteAnalytics.track('prototype_lang_switched', {
        source: 'login_lang_toggle',
        from_lang: previousLang,
        to_lang: lang,
      });
    });

    /* ── Password Toggle ───────────────────────────────────────── */
    document.getElementById('eyeToggle').addEventListener('click', () => {
      const input = document.getElementById('password');
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      document.getElementById('eyeOff').style.display = isHidden ? 'none' : '';
      document.getElementById('eyeOn').style.display  = isHidden ? '' : 'none';
      document.getElementById('eyeToggle').setAttribute(
        'aria-label',
        isHidden ? i18n[lang].eyeHide : i18n[lang].eyeShow
      );
    });

    /* ── Validation ────────────────────────────────────────────── */
    function setFieldError(fieldId, errorId, msg) {
      const input = document.getElementById(fieldId);
      const err   = document.getElementById(errorId);
      input.classList.add('error');
      err.textContent = msg;
      err.classList.add('visible');
    }
    function clearFieldError(fieldId, errorId) {
      const input = document.getElementById(fieldId);
      const err   = document.getElementById(errorId);
      input.classList.remove('error');
      err.classList.remove('visible');
    }
    function clearErrors() {
      clearFieldError('email', 'emailError');
      clearFieldError('password', 'passwordError');
      document.getElementById('errorBanner').classList.remove('visible');
    }

    document.getElementById('email').addEventListener('input', () => {
      clearFieldError('email', 'emailError');
    });
    document.getElementById('password').addEventListener('input', () => {
      clearFieldError('password', 'passwordError');
    });

    /* ── Form Submit ───────────────────────────────────────────── */
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const t        = i18n[lang];
      let hasError   = false;

      if (!email) {
        setFieldError('email', 'emailError', t.emailRequired);
        hasError = true;
      }
      if (!password) {
        setFieldError('password', 'passwordError', t.passwordRequired);
        hasError = true;
      }
      if (hasError) {
        window.LabelSuiteAnalytics.track('prototype_login_failed_validation', {
          ...getTrackingContext(),
        });
        return;
      }

      window.LabelSuiteAnalytics.track('prototype_login_attempted', {
        ...getTrackingContext(),
        method: 'email_password',
      });

      // Loading state — replace entire button content to prevent applyLang()
      // from writing text into a detached #loginBtnText during the async window
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      const spinner = document.createElement('span');
      spinner.className = 'spinner';
      spinner.setAttribute('aria-label', '載入中');
      btn.textContent = '';
      btn.appendChild(spinner);

      // Simulate async login
      await new Promise(r => setTimeout(r, 800));

      // Prototype: login always succeeds — navigate to dashboard
      window.LabelSuiteAnalytics.track('prototype_login_succeeded', {
        ...getTrackingContext(),
        method: 'email_password',
      });
      /* label-suite/label-suite#195: remember it, so spec 01-01 Q3's "an
         already-signed-in visitor goes straight to the dashboard" has something
         to read. The sidebar owns the flag because its logout clears it. */
      window.LabelSuiteSharedSidebar.markLoggedIn();
      window.location.href = '../dashboard/dashboard.html';
    });

    /* ── SSO Button (prototype feedback) ──────────────────────── */
    document.getElementById('ssoBtn').addEventListener('click', () => {
      // Prototype: no-op with visual press feedback
      window.LabelSuiteAnalytics.track('prototype_google_sso_clicked', {
        ...getTrackingContext(),
      });
    });

    /* ── Init ──────────────────────────────────────────────────── */
    window.LabelSuiteAnalytics.bindClickTracks(
      [
        { id: 'forgotLink', eventName: 'prototype_forgot_password_clicked' },
        { id: 'registerLink', eventName: 'prototype_navigate_register_clicked' },
      ],
      getTrackingContext
    );
    applyLang(window.LabelSuiteSharedSidebar.getStoredLang());
    window.LabelSuiteAnalytics.trackPageView('login', getTrackingContext);
  </script>
</body>
</html>
