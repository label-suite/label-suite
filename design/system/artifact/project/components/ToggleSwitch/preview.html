<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  /* showcase-chrome row shell (components-showcase.html:133-136), not part of the component */
  .toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; max-width: 360px; }
  .toggle-info { display: flex; flex-direction: column; }
  .toggle-label-text { font-size: 14px; font-weight: 500; color: var(--color-ink); }
  .toggle-desc { font-size: 12px; color: var(--color-ink-muted); }
</style>
</head>
<body>
  <div style="display: grid; gap: 16px;">
    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label-text">Dry-run mode</span>
        <span class="toggle-desc">Run without materializing results</span>
      </div>
      <label class="toggle-switch" aria-label="Toggle dry-run mode">
        <input type="checkbox">
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label-text">Email 通知</span>
        <span class="toggle-desc">任務指派時寄信（開啟）</span>
      </div>
      <label class="toggle-switch" aria-label="Email 通知">
        <input type="checkbox" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
</body>
</html>
