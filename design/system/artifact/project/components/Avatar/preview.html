<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  .ds-col { display: flex; flex-direction: column; gap: 6px; }
  .ds-stage { gap: 32px; align-items: flex-start; }
  /* preview-only: hold the hover overlay open so the state is visible without a pointer */
  .ds-hover .avatar-overlay { opacity: 1; }
</style>
</head>
<body>
<div class="ds-stage">
    <div class="ds-col">
      <span class="ds-caption">display-only 32px</span>
      <img src="data:image/svg+xml,%3Csvg%20width%3D%2248%22%20height%3D%2248%22%20viewBox%3D%220%200%2048%2048%22%20fill%3D%22none%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2212%22%20fill%3D%22%236366F1%22%2F%3E%3Cg%20transform%3D%22translate(12%2C%2012)%22%3E%3Cpath%20d%3D%22M20.59%2013.41l-7.17%207.17a2%202%200%200%201-2.83%200L2%2012V2h10l8.59%208.59a2%202%200%200%201%200%202.82z%22%20stroke%3D%22white%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cline%20x1%3D%227%22%20y1%3D%227%22%20x2%3D%227.01%22%20y2%3D%227%22%20stroke%3D%22white%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E" alt="使用者頭像" class="avatar-sm">
    </div>
    <div class="ds-col">
      <span class="ds-caption">可上傳：首字</span>
      <div class="avatar-wrap" role="button" tabindex="0" aria-label="上傳頭像" aria-describedby="avatar-error-a">
        <div class="avatar-preview">陳</div>
        <div class="avatar-overlay" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></div>
      </div>
      <p id="avatar-error-a" class="avatar-error" role="alert"></p>
      <p class="avatar-hint">JPG、PNG 或 WebP，最大 5 MB</p>
    </div>
    <div class="ds-col">
      <span class="ds-caption">hover：上傳遮罩</span>
      <div class="avatar-wrap ds-hover" role="button" tabindex="0" aria-label="上傳頭像">
        <div class="avatar-preview">陳</div>
        <div class="avatar-overlay" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></div>
      </div>
    </div>
    <div class="ds-col">
      <span class="ds-caption">錯誤：檔案不符</span>
      <div class="avatar-wrap" role="button" tabindex="0" aria-label="上傳頭像" aria-describedby="avatar-error-c">
        <div class="avatar-preview">陳</div>
        <div class="avatar-overlay" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg></div>
      </div>
      <p id="avatar-error-c" class="avatar-error visible" role="alert">檔案超過 5 MB</p>
    </div>
  </div>
</body>
</html>
