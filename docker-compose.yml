# Lite-tier orchestration: migrate, backend, redis, worker and frontend, with the
# database in a file on a named volume (ADR-003 D7; system-design D1, D3). Copy .env.example to
# .env and `docker compose up --build --wait --wait-timeout 300` then needs no
# further arguments.
#
# Requires Docker Compose v2.20.0 or newer: older versions treat the one-off
# migrate container, which has already exited successfully, as a --wait failure
# (system-design D7).
#
# The production tier is a separate file, not an overlay. Run it with
# `docker compose -f docker-compose.prod.yml ...` (system-design D2).

# Fixed project name, so the volume below is always label-suite_label-suite-data
# regardless of the directory this checkout sits in. The production tier uses a
# different project name, so the two tiers never share containers or volumes.
name: label-suite

# The migration service and the API are the same image with a different command
# (ADR-008 D2). Declaring the same build and the same tag on both keeps one
# image: the second build is a cache hit.
x-backend-image: &backend-image
  build:
    context: ./backend
  image: label-suite-backend:latest

services:
  # One-off: brings the database to the latest revision before the API starts.
  # It reads database settings only - a migration never needs
  # CORS_ALLOWED_ORIGINS (system-design D1).
  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment:
      # Resolved against WORKDIR /app, so this default is the file inside the
      # volume mounted below and the Lite tier needs no edit (system-design D3).
      SQLITE_PATH: ${SQLITE_PATH:-./data/label_suite.db}
    volumes:
      - label-suite-data:/app/data
    # A one-off task: a restart would run the migration a second time.
    restart: "no"

  backend:
    <<: *backend-image
    # The image's own CMD runs uvicorn; it is not repeated here.
    depends_on:
      # The API starts only after the migration has exited 0. A failed migration
      # therefore leaves the API down and fails `up`, with the error in the
      # migrate log only (system-design D1).
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # No default on purpose: unset or empty makes Compose fail interpolation
      # before any container is created (system-design D6, D7; Hard Rule 7 -
      # the value must never be "*", which the backend itself also rejects).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      SQLITE_PATH: ${SQLITE_PATH:-./data/label_suite.db}
      # Passed from .env so deployers can tune log noise; INFO when unset (#567 Q14).
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The only address uvicorn trusts for X-Forwarded-For and X-Forwarded-Proto: the
      # frontend's pinned address below. Set it in .env only when the subnet changes
      # (#566; the value is validated at start-up, "*" is rejected).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-10.77.250.10}
      # Sign-in settings (login-auth-guard design D4). Unset reaches the backend as
      # an empty string, which it treats as unset: without AUTH_SECRET the Lite
      # backend generates one and keeps it on the data volume below.
      AUTH_SECRET: ${AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Mail and queue (email-celery-worker design D11): the same values as the
      # worker. Set both mail values or neither, or the backend refuses to start.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      REDIS_URL: redis://redis:6379
    volumes:
      - label-suite-data:/app/data
    healthcheck:
      # The slim base image has no curl, so the image's own Python makes the
      # call; urlopen raises on any non-2xx status (system-design D5).
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=5).read()
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    # No ports: the API is reachable only inside the Compose network, through
    # the frontend's reverse proxy (ADR-008 D1; system-design D6).
    stop_grace_period: 30s

  # The Celery broker and result store (ADR-003 D8): database 0 for the queue,
  # 1 for results. No ports - only the backend and the worker reach it, inside the
  # Compose network - and no volume: losing queued mail on a restart is accepted,
  # since every such mail can be triggered again (email-celery-worker design D11).
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

  # The background worker: the backend image with Celery as the command
  # (ADR-008 D2). It reads WorkerSettings only, so it needs neither
  # CORS_ALLOWED_ORIGINS nor AUTH_SECRET. CELERY_TASK_ALWAYS_EAGER is never passed
  # to any container: in-process tasks are for `pnpm run dev` and e2e only
  # (email-celery-worker design D4, D11).
  worker:
    <<: *backend-image
    command: ["celery", "-A", "app.worker", "worker", "-Q", "default,scoring", "--concurrency", "2"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # The same database file as the backend, on the same volume below.
      SQLITE_PATH: ${SQLITE_PATH:-./data/label_suite.db}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379
      # Set both or neither: one without the other stops the worker at start-up.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - label-suite-data:/app/data
    healthcheck:
      # Pings this worker only; $$ keeps Compose from interpolating HOSTNAME.
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Warm shutdown: a running task gets up to 300 seconds to finish, plus a margin
    # (ADR-008 D10; architecture.mdx §部署與維運).
    stop_grace_period: 330s

  frontend:
    build:
      # The build context is the repository root, not frontend/: the production
      # build also reads pnpm-lock.yaml, pnpm-workspace.yaml and
      # design/prototype/assets (frontend/Dockerfile).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Empty, not the .env value: this container serves the API from its own
        # origin, so the browser calls relative paths (system-design D6). The
        # .env value is for the local dev server only.
        VITE_API_BASE_URL: ""
    image: label-suite-frontend:latest
    networks:
      default:
        # Pinned, outside the network's ip_range, so no other container can take it
        # and the backend's trust list stays a single address (#566 design D2).
        ipv4_address: 10.77.250.10
    depends_on:
      # nginx resolves the backend upstream once, at start-up, so it must not
      # start before the API is healthy (system-design D5; frontend/nginx.conf).
      backend:
        condition: service_healthy
    ports:
      # The only published port of either tier (system-design D6). Changing it
      # means changing CORS_ALLOWED_ORIGINS in .env to match.
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      # busybox wget, present in nginx:alpine; the SPA fallback answers 200.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

# Fixed subnet for the default network (#566, trusted-proxy-client-ip design D2).
# The backend trusts X-Forwarded-For and X-Forwarded-Proto only from the frontend
# container, so that container needs an address that never changes: it is pinned
# below and kept out of ip_range, the only part of the subnet Docker hands out to
# other containers. The subnet is outside Docker's default pools (172.16.0.0/12 and
# 192.168.0.0/16). The same three values are in docker-compose.prod.yml; CI checks
# that they match. Because of that, the two tiers cannot run on one host at the same
# time: `docker compose down` one before starting the other.
networks:
  default:
    ipam:
      config:
        - subnet: 10.77.250.0/24
          ip_range: 10.77.250.128/25

volumes:
  # Not a bind mount to ./data: the backend runs as a non-root user and a host
  # directory created by Docker belongs to root, which SQLite cannot write to.
  # Back it up with `docker compose cp` (system-design D3).
  label-suite-data:
