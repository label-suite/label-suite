<!-- @dsCard group="Data display" height=300 -->
<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  .ds-col { display: flex; flex-direction: column; gap: 6px; }
  .ds-stack { display: flex; flex-direction: column; gap: 20px; width: 100%; align-items: stretch; }
</style>
</head>
<body>
<div class="ds-stage ds-stack">
    <div class="ds-col">
      <span class="ds-caption">剛建立：停在待審，兩軌都還沒走</span>
      <div class="review-track" role="list" aria-label="審核單位狀態">
        <span class="review-track-node current" role="listitem" aria-current="step" style="grid-column:1;grid-row:1/3"><span class="review-track-marker">目前：</span>待審</span>
        <span class="review-track-fork" aria-hidden="true" style="grid-column:2;grid-row:1/3"><svg width="28" height="68" viewBox="0 0 28 68" fill="none"><path d="M0 34 H12 V17 H28" stroke="var(--color-border)" stroke-width="2"/><path d="M0 34 H12 V51 H28" stroke="var(--color-border)" stroke-width="2"/></svg></span>
        <span class="review-track-branch" data-branch="same" style="grid-column:3;grid-row:1">答案未修改</span>
        <span class="review-track-branch" data-branch="differing" style="grid-column:3;grid-row:2">答案有修改</span>
        <span class="review-track-rail" style="grid-column:4/6;grid-row:1"></span>
        <span class="review-track-node" role="listitem" style="grid-column:4;grid-row:2">爭議中</span>
        <span class="review-track-rail" style="grid-column:5;grid-row:2"><span class="review-track-branch" data-branch="arbitrated">仲裁後</span></span>
        <span class="review-track-fork" aria-hidden="true" style="grid-column:6;grid-row:1/3"><svg width="28" height="68" viewBox="0 0 28 68" fill="none"><path d="M0 17 H16 V34 H28" stroke="var(--color-border)" stroke-width="2"/><path d="M0 51 H16 V34 H28" stroke="var(--color-border)" stroke-width="2"/></svg></span>
        <span class="review-track-node" role="listitem" style="grid-column:7;grid-row:1/3">已定稿</span>
      </div>
    </div>
    <div class="ds-col">
      <span class="ds-caption">走在差異軌，目前停在爭議中</span>
      <div class="review-track" role="list" aria-label="審核單位狀態">
        <span class="review-track-node done" role="listitem" style="grid-column:1;grid-row:1/3">待審</span>
        <span class="review-track-fork" aria-hidden="true" style="grid-column:2;grid-row:1/3"><svg width="28" height="68" viewBox="0 0 28 68" fill="none"><path d="M0 34 H12 V17 H28" stroke="var(--color-border)" stroke-width="2"/><path d="M0 34 H12 V51 H28" stroke="var(--color-cta)" stroke-width="3"/></svg></span>
        <span class="review-track-branch" data-branch="same" style="grid-column:3;grid-row:1">答案未修改</span>
        <span class="review-track-branch done" data-branch="differing" style="grid-column:3;grid-row:2">答案有修改</span>
        <span class="review-track-rail" style="grid-column:4/6;grid-row:1"></span>
        <span class="review-track-node current" role="listitem" aria-current="step" style="grid-column:4;grid-row:2"><span class="review-track-marker">目前：</span>爭議中</span>
        <span class="review-track-rail" style="grid-column:5;grid-row:2"><span class="review-track-branch" data-branch="arbitrated">仲裁後</span></span>
        <span class="review-track-fork" aria-hidden="true" style="grid-column:6;grid-row:1/3"><svg width="28" height="68" viewBox="0 0 28 68" fill="none"><path d="M0 17 H16 V34 H28" stroke="var(--color-border)" stroke-width="2"/><path d="M0 51 H16 V34 H28" stroke="var(--color-border)" stroke-width="2"/></svg></span>
        <span class="review-track-node" role="listitem" style="grid-column:7;grid-row:1/3">已定稿</span>
      </div>
    </div>
  </div>
</body>
</html>
