<!-- @dsCard group="Feedback" height=440 -->
<!doctype html>
<html lang="zh-TW" data-theme="light">
<head>
<meta charset="utf-8">
<style>
  /* preview layout only; the frame preloads tokens.css and bundle.css */
  html body { margin: 0; padding: 24px; display: block; }
  .ds-stage { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .ds-caption { font-size: 12px; color: var(--color-ink-muted); }
  .ds-stack { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 420px; align-items: stretch; }
</style>
</head>
<body>
<div class="ds-stage ds-stack">
    <section class="state-panel state-panel--success">
      <div class="state-panel-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h4 class="state-panel-title">請到信箱收信</h4>
      <p class="state-panel-desc">我們已把重設密碼的連結寄到你的信箱。</p>
      <a href="#" class="state-panel-action">回到登入</a>
    </section>
    <section class="state-panel state-panel--error" role="alert">
      <div class="state-panel-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      </div>
      <h4 class="state-panel-title">重設連結已失效</h4>
      <p class="state-panel-desc">請重新申請一封重設密碼信。</p>
      <a href="#" class="state-panel-action">重新申請連結</a>
    </section>
  </div>
</body>
</html>
