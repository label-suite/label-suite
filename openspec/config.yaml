schema: spec-driven

context: |
  Two layers of specification:
  - docs/00-prd.mdx and docs/specs/NNN-*.mdx describe what the product does and why.
    The maintainer owns them; do not change a requirement there from an OpenSpec change.
  - openspec/specs/ is the testable contract for implementation and tests. Change it
    only through a change's spec deltas.
  Every requirement in a delta must trace to a docs/ spec (cite its FR / AC ID). When
  a delta and docs/ disagree, docs/ wins: stop and raise the conflict as an open question
  for the maintainer instead of choosing one side.
  AGENTS.md is the single rule source; this is only a pointer to the parts OpenSpec
  work touches most. Read the named section before acting on it.
  - Issue first: no change starts without an open issue that lists the work
    (AGENTS.md "Hard Rules" and "Development Workflow").
  - Branches and commits: never commit to main; commit messages follow AGENTS.md
    "Commits", with the full rules in docs/commit-and-release.md.
  - Language: artifacts are in Traditional Chinese; OpenSpec structural headings and
    the SHALL / MUST keywords stay in English (AGENTS.md "Language Rules").
  Run the CLI as `npx openspec`.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
